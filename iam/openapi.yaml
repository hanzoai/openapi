openapi: 3.1.0
info:
  title: Hanzo IAM
  description: 'Identity and access for the Hanzo Cloud: OpenID Connect and OAuth2 with PKCE, passkeys,
    one-time codes, wallets, external identity providers, SCIM 2.0 provisioning, and the directory of
    organizations, people, roles and permissions behind them.


    A principal is addressed as `<org>/<username>` on every surface. Every operation takes a bearer token
    from https://hanzo.id unless it is marked otherwise — sign-in and discovery necessarily answer before
    you have one.'
  version: 8.0.0
  contact:
    name: Hanzo AI
    url: https://hanzo.ai
    email: support@hanzo.ai
servers:
- url: https://hanzo.id
  description: Hanzo IAM
tags:
- name: Discovery
  description: Where the endpoints are and which keys verify a token — everything a standards client needs
    to configure itself.
- name: Sign-in
  description: 'Signing a person in: the OAuth2/OIDC flows, the front door a sign-in page renders from,
    and the sign-up and one-time-code endpoints.'
- name: Account
  description: What the signed-in caller can read and change about themselves.
- name: Multi-factor
  description: Enrolling and choosing second factors.
- name: Credentials
  description: Tokens and API keys — minted for a person by a trusted backend, or held by a program of
    its own.
- name: Directory
  description: Who belongs to an organization, and the SCIM 2.0 surface an identity provider drives.
- name: applications
  description: The products and sites your people sign in to.
- name: organizations
  description: Tenants. Every other object is owned by one.
- name: users
  description: The people in an organization.
- name: roles
  description: Named sets of people, granted permissions together.
- name: permissions
  description: Who may do what to which objects.
- name: providers
  description: External identity providers and the services an application talks to.
- name: certs
  description: The signing certificates tokens are issued under.
- name: keys
  description: API keys held in the directory.
- name: tokens
  description: Issued access tokens, so you can see and revoke them.
- name: sessions
  description: Open sign-ins, per person and application.
- name: invitations
  description: Outstanding invitations to join an organization.
- name: projects
  description: Projects inside an organization.
- name: workspaces
  description: Workspaces inside a project.
- name: audit-logs
  description: What happened, who did it and when.
- name: webauthn-credentials
  description: Registered passkeys.
security:
- BearerAuth: []
paths:
  /.well-known/jwks:
    get:
      operationId: discovery_jwks
      summary: Fetch the public keys that verify tokens issued here
      tags:
      - Discovery
      responses:
        '200': &id001
          description: ok
      description: One key set, published at both this address and the /v1/iam twin.
      security: []
  /.well-known/oauth-authorization-server:
    get:
      operationId: discovery_oauth
      summary: Discover this authorization server
      tags:
      - Discovery
      responses:
        '200': *id001
      description: The same self-consistent document at the OAuth address (RFC 8414), so an OAuth-only
        client finds it too.
      security: []
  /.well-known/openid-configuration:
    get:
      operationId: discovery_openid
      summary: Discover this identity service
      tags:
      - Discovery
      responses:
        '200': *id001
      description: Returns the endpoints, grants, scopes and signing algorithms this service supports,
        so a standards client configures itself instead of hard-coding addresses.
      security: []
  /v1/iam/.well-known/jwks:
    get:
      operationId: discovery_jwks_v1
      summary: Fetch the public keys that verify tokens issued here
      tags:
      - Discovery
      responses:
        '200': *id001
      security: []
  /v1/iam/.well-known/oauth-authorization-server:
    get:
      operationId: discovery_oauth_v1
      summary: Discover this authorization server
      tags:
      - Discovery
      responses:
        '200': *id001
      security: []
  /v1/iam/.well-known/openid-configuration:
    get:
      operationId: discovery_openid_v1
      summary: Discover this identity service
      tags:
      - Discovery
      responses:
        '200': *id001
      security: []
  /v1/iam/account:
    get:
      operationId: account
      summary: Read the caller’s own account and organization
      tags:
      - Account
      responses:
        '200': *id001
      description: Every secret — password hash, access secret, one-time-code seed, recovery codes — is
        removed.
  /v1/iam/applications:
    get:
      description: 'Returns the applications in one organization, newest first —

        each product or site your people sign in to, with the sign-in methods and

        redirect URIs it allows.'
      operationId: applications_list
      parameters:
      - in: query
        name: owner
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationListResult'
          description: ok
      summary: Returns the applications in one organization, newest first — each product or site your
        people sign in to, with the sign-in methods and redirect URIs it allows.
      tags:
      - applications
    post:
      description: 'Registers an application in your organization — one product or site

        your people sign in to, with its own client credentials, sign-in methods and

        allowed redirect URIs. A name already used in the organization is refused

        rather than overwritten.


        Exported so the legacy add-application alias reuses this exact path — one

        create, two spellings.'
      operationId: applications_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Application'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ok
      summary: Registers an application in your organization — one product or site your people sign in
        to, with its own client credentials, sign-in methods and allowed redirect URIs.
      tags:
      - applications
  /v1/iam/applications/delete:
    post:
      description: 'Removes an application. Anyone mid-sign-in through it is

        turned away and its client credentials stop working, so retire the integration

        before deleting it.'
      operationId: applications_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationRef'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResult'
          description: ok
      summary: Removes an application.
      tags:
      - applications
  /v1/iam/applications/get:
    get:
      description: 'Returns one application: its sign-in methods, its allowed

        redirect URIs and the client credentials your integration authenticates with.'
      operationId: applications_get
      parameters:
      - in: query
        name: owner
        required: true
        schema:
          type: string
      - in: query
        name: name
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ok
      summary: 'Returns one application: its sign-in methods, its allowed redirect URIs and the client
        credentials your integration authenticates with.'
      tags:
      - applications
  /v1/iam/applications/update:
    post:
      description: 'Changes an application''s display, its sign-in methods and the redirect

        URIs it may return to — the call that makes login work from a new host. Which

        organization it belongs to and what it is named are fixed when it is created

        and are not editable here.


        Exported so the legacy update-application alias reuses this exact path — one

        update, two spellings.'
      operationId: applications_update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Application'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ok
      summary: Changes an application's display, its sign-in methods and the redirect URIs it may return
        to — the call that makes login work from a new host.
      tags:
      - applications
  /v1/iam/audit-logs:
    get:
      description: 'Returns your organization''s audit trail, newest first — who did

        what, when, and from where. It is the record you reach for during a security

        review or an incident.


        You see your own organization''s audit trail and no one else''s; which organization that

        is comes from your credentials, not from the request.'
      operationId: audit_logs_list
      parameters:
      - in: query
        name: owner
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOutput'
          description: ok
      summary: Returns your organization's audit trail, newest first — who did what, when, and from where.
      tags:
      - audit-logs
    post:
      description: 'Records an audit entry, so activity from your own systems lands in the

        same trail as everything the Hanzo Cloud records for you.'
      operationId: audit_logs_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auditlogs.Input'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ok
      summary: Records an audit entry, so activity from your own systems lands in the same trail as everything
        the Hanzo Cloud records for you.
      tags:
      - audit-logs
  /v1/iam/audit-logs/delete:
    post:
      description: 'Removes an audit entry. Retention policy is normally what should expire

        a trail; deleting by hand leaves a gap a reviewer will notice.'
      operationId: audit_logs_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ref'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteOutput'
          description: ok
      summary: Removes an audit entry.
      tags:
      - audit-logs
  /v1/iam/audit-logs/get:
    post:
      description: 'Returns one audit entry in full: the action, the person or key behind it,

        and the request it came in on.'
      operationId: audit_logs_get
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ref'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ok
      summary: 'Returns one audit entry in full: the action, the person or key behind it, and the request
        it came in on.'
      tags:
      - audit-logs
  /v1/iam/audit-logs/update:
    post:
      description: 'Corrects an audit entry. The trail is append-only in normal operation

        and nothing in the Hanzo Cloud rewrites it — this exists for an administrator

        to correct an entry their own systems recorded wrongly.'
      operationId: audit_logs_update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auditlogs.Input'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ok
      summary: Corrects an audit entry.
      tags:
      - audit-logs
  /v1/iam/auth/application:
    get:
      operationId: auth_application
      summary: Read the application a sign-in page renders from
      tags:
      - Sign-in
      responses:
        '200': *id001
      description: The application resolved by client id, with its client secret and every provider secret
        removed — this is read by a browser.
      parameters:
      - name: clientId
        in: query
        required: true
        schema:
          type: string
        description: The application to answer for.
      security: []
  /v1/iam/auth/methods:
    get:
      operationId: auth_methods
      summary: List the sign-in methods an application offers
      tags:
      - Sign-in
      responses:
        '200': *id001
      description: Password, one-time code, passkey, wallet and each configured external provider — so
        one sign-in page renders the right buttons for any application instead of hard-coding a list.
        A provider with no real credential is left out rather than shown as a dead end.
      parameters:
      - name: clientId
        in: query
        required: true
        schema:
          type: string
        description: The application to answer for.
      security: []
  /v1/iam/certs:
    get:
      description: 'Returns your organization''s signing certificates, newest first — the keys

        the tokens your applications verify are signed with. Private key material is

        masked.


        You see your own organization''s certificates and no one else''s; which

        organization that is comes from your credentials, not from the request, so a

        query parameter can never widen the listing.'
      operationId: certs_list
      parameters:
      - in: query
        name: owner
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/certs.ListOutput'
          description: ok
      summary: Returns your organization's signing certificates, newest first — the keys the tokens your
        applications verify are signed with.
      tags:
      - certs
    post:
      description: 'Adds a signing certificate your applications can verify tokens against

        — the call you make to bring your own key, or to stage the next one before a

        rotation. A name already used in your organization is refused.'
      operationId: certs_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cert'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cert'
          description: ok
      summary: Adds a signing certificate your applications can verify tokens against — the call you make
        to bring your own key, or to stage the next one before a rotation.
      tags:
      - certs
  /v1/iam/certs/delete:
    post:
      description: 'Removes a signing certificate. Tokens signed with it can no longer be

        verified, so retire it only once nothing is still presenting them.'
      operationId: certs_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/certs.Ref'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/certs.DeleteOutput'
          description: ok
      summary: Removes a signing certificate.
      tags:
      - certs
  /v1/iam/certs/get:
    post:
      description: 'Returns one signing certificate — its algorithm, its validity window and

        its public half. The private key is masked.'
      operationId: certs_get
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/certs.Ref'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cert'
          description: ok
      summary: Returns one signing certificate — its algorithm, its validity window and its public half.
      tags:
      - certs
  /v1/iam/certs/update:
    post:
      description: 'Changes a signing certificate''s settings. What it is called does not

        change, and neither does when it was added.'
      operationId: certs_update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cert'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cert'
          description: ok
      summary: Changes a signing certificate's settings.
      tags:
      - certs
  /v1/iam/consent:
    get:
      operationId: consent_get
      summary: Read the caller’s data-sharing choices
      tags:
      - Account
      responses:
        '200': *id001
    put:
      operationId: consent_set
      summary: Set the caller’s data-sharing choices
      tags:
      - Account
      responses:
        '200': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /v1/iam/invitations:
    get:
      description: 'Returns your organization''s invitations, newest first — who has

        been asked to join, on what terms, and how many seats each invitation still

        has left.


        You see your own organization''s invitations and no one else''s; which organization that

        is comes from your credentials, not from the request.'
      operationId: invitations_list
      parameters:
      - in: query
        name: owner
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invitations.ListOutput'
          description: ok
      summary: Returns your organization's invitations, newest first — who has been asked to join, on
        what terms, and how many seats each invitation still has left.
      tags:
      - invitations
    post:
      description: 'Issues an invitation to join your organization — the code or link a new

        member redeems, with the role they arrive holding and the date it stops

        working. A name already used in the organization is refused.'
      operationId: invitations_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/invitations.Input'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ok
      summary: Issues an invitation to join your organization — the code or link a new member redeems,
        with the role they arrive holding and the date it stops working.
      tags:
      - invitations
  /v1/iam/invitations/delete:
    post:
      description: 'Withdraws an invitation. It stops being redeemable at once; anyone who

        already joined through it keeps their account.'
      operationId: invitations_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/invitations.Ref'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invitations.DeleteOutput'
          description: ok
      summary: Withdraws an invitation.
      tags:
      - invitations
  /v1/iam/invitations/get:
    post:
      description: 'Returns one invitation: who it is for, what it grants on acceptance, and

        when it expires.'
      operationId: invitations_get
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/invitations.Ref'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ok
      summary: 'Returns one invitation: who it is for, what it grants on acceptance, and when it expires.'
      tags:
      - invitations
  /v1/iam/invitations/update:
    post:
      description: 'Changes an invitation''s terms — the role it grants, how many may redeem

        it, or when it expires. What it is called does not change.'
      operationId: invitations_update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/invitations.Input'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ok
      summary: Changes an invitation's terms — the role it grants, how many may redeem it, or when it
        expires.
      tags:
      - invitations
  /v1/iam/keys:
    get:
      description: 'Returns your organization''s API keys, newest first — what each is called,

        what it may reach, and its publishable half. Secret halves are never listed.'
      operationId: keys_list
      parameters:
      - in: query
        name: owner
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
          description: ok
      summary: Returns your organization's API keys, newest first — what each is called, what it may reach,
        and its publishable half.
      tags:
      - keys
    post:
      description: 'Issues an API key. A standard key comes back as a publishable half you

        may ship in client code and a secret half you must not — the secret is shown

        once, at creation, and cannot be retrieved afterwards. A publish-scoped key is

        issued with the publishable half only, so there is no secret to leak.


        A name already used in your organization is refused rather than reissued, so

        creating twice never silently invalidates a key that is in production.'
      operationId: keys_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Key'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
          description: ok
      summary: Issues an API key.
      tags:
      - keys
  /v1/iam/keys/delete:
    post:
      description: 'Revokes an API key. Anything still presenting it stops being authorized at

        once, so roll the replacement out before you revoke.'
      operationId: keys_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/keys.Ref'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
          description: ok
      summary: Revokes an API key.
      tags:
      - keys
  /v1/iam/keys/get:
    get:
      description: 'Returns one API key: what it is called, what it may reach, and when it was

        issued.'
      operationId: keys_get
      parameters:
      - in: query
        name: owner
        required: false
        schema:
          type: string
      - in: query
        name: name
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
          description: ok
      summary: 'Returns one API key: what it is called, what it may reach, and when it was issued.'
      tags:
      - keys
  /v1/iam/keys/mint:
    post:
      operationId: keys_mint
      summary: Mint or rotate a person’s API key, and return it once
      tags:
      - Credentials
      responses:
        '200': *id001
      description: 'The key type is a field, not a second endpoint: `secret` (the default) is confidential
        and resolves the person; `publishable` is safe to ship in browser code and resolves only their
        organization.'
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
        description: The person, as `<org>/<username>`.
      - name: type
        in: query
        required: false
        schema:
          type: string
        description: '`secret` (default) or `publishable`.'
      security: []
  /v1/iam/keys/revoke:
    post:
      operationId: keys_revoke
      summary: Revoke a person’s API key immediately
      tags:
      - Credentials
      responses:
        '200': *id001
      description: Scoped by the same `type` field mint takes, so revoking the browser key leaves the
        server key working.
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
        description: The person, as `<org>/<username>`.
      - name: type
        in: query
        required: false
        schema:
          type: string
        description: '`secret` (default) or `publishable`.'
      security: []
  /v1/iam/keys/update:
    post:
      description: 'Changes what a key is called or what it may reach. The credential

        itself is not reissued — the key in your deployment keeps working.'
      operationId: keys_update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Key'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
          description: ok
      summary: Changes what a key is called or what it may reach.
      tags:
      - keys
  /v1/iam/linked-accounts:
    get:
      operationId: linked_accounts
      summary: List the external identity provider accounts linked to this identity
      tags:
      - Sign-in
      responses:
        '200': *id001
  /v1/iam/login:
    post:
      operationId: login
      summary: Sign in with a password, a one-time code, a passkey or a wallet, and return an authorization
        code
      tags:
      - Sign-in
      responses:
        '200': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      security: []
  /v1/iam/memberships:
    get:
      operationId: memberships_list
      summary: List who belongs to an organization, and in what role
      tags:
      - Directory
      responses:
        '200': *id001
    post:
      operationId: memberships_create
      summary: Add someone to an organization
      tags:
      - Directory
      responses:
        '200': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /v1/iam/mfa/disable:
    post:
      operationId: mfa_disable
      summary: Turn off a multi-factor method
      tags:
      - Multi-factor
      responses:
        '200': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /v1/iam/mfa/preferred:
    post:
      operationId: mfa_preferred
      summary: Choose which multi-factor method is used by default
      tags:
      - Multi-factor
      responses:
        '200': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /v1/iam/mfa/setup/enable:
    post:
      operationId: mfa_setup_enable
      summary: Turn on multi-factor sign-in once enrolment is verified
      tags:
      - Multi-factor
      responses:
        '200': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /v1/iam/mfa/setup/initiate:
    post:
      operationId: mfa_setup_initiate
      summary: Begin multi-factor enrolment and return the shared secret
      tags:
      - Multi-factor
      responses:
        '200': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /v1/iam/mfa/setup/verify:
    post:
      operationId: mfa_setup_verify
      summary: Verify a multi-factor enrolment code
      tags:
      - Multi-factor
      responses:
        '200': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /v1/iam/oauth/authorize:
    get:
      operationId: oauth_authorize
      summary: Start a sign-in and return an authorization code
      tags:
      - Sign-in
      responses:
        '200': *id001
      description: The authorization-code flow with PKCE (S256 always). Naming a provider starts a hand-off
        to that external identity provider instead.
      parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: string
        description: The application signing the person in.
      - name: redirect_uri
        in: query
        required: true
        schema:
          type: string
        description: Where to return once they are signed in — must be one the application allows.
      - name: response_type
        in: query
        required: false
        schema:
          type: string
        description: Always `code`.
      - name: scope
        in: query
        required: false
        schema:
          type: string
        description: Space-separated scopes, e.g. `openid profile email`.
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: Round-tripped to your redirect, for CSRF protection.
      - name: code_challenge
        in: query
        required: false
        schema:
          type: string
        description: The PKCE challenge.
      - name: code_challenge_method
        in: query
        required: false
        schema:
          type: string
        description: Always `S256`.
      - name: provider
        in: query
        required: false
        schema:
          type: string
        description: Hand off to this external identity provider.
      security: []
  /v1/iam/oauth/callback:
    get:
      operationId: oauth_callback
      summary: Finish a sign-in that was handed off to an external identity provider
      tags:
      - Sign-in
      responses:
        '200': *id001
      security: []
  /v1/iam/oauth/device:
    post:
      operationId: oauth_device
      summary: Start a sign-in on a device with no browser
      tags:
      - Sign-in
      responses:
        '200': *id001
      description: RFC 8628. Returns the code to show the person and the address where they approve it;
        poll the token endpoint until they do.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      security: []
  /v1/iam/oauth/federation/mfa:
    post:
      operationId: oauth_federation_mfa
      summary: Complete the second factor for a sign-in that came from an external identity provider
      tags:
      - Sign-in
      responses:
        '200': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      security: []
  /v1/iam/oauth/introspect:
    post:
      operationId: oauth_introspect
      summary: Report whether a token is still valid, and what it grants
      tags:
      - Sign-in
      responses:
        '200': *id001
      description: 'RFC 7662. Client-authenticated: a resource server asks about a token it was handed.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      security: []
  /v1/iam/oauth/logout:
    get:
      operationId: oauth_logout
      summary: End the session and sign the person out of every application in it
      tags:
      - Sign-in
      responses:
        '200': *id001
  /v1/iam/oauth/revoke:
    post:
      operationId: oauth_revoke
      summary: Revoke a token immediately
      tags:
      - Sign-in
      responses:
        '200': *id001
      description: RFC 7009.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      security: []
  /v1/iam/oauth/token:
    post:
      operationId: oauth_token
      summary: Exchange a code, refresh token or client credential for an access token
      tags:
      - Sign-in
      responses:
        '200': *id001
      description: Supports the authorization-code, refresh-token, client-credentials, password, token-exchange
        and device grants.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      security: []
  /v1/iam/oauth/userinfo:
    get:
      operationId: oauth_userinfo
      summary: Read the signed-in identity behind an access token
      tags:
      - Sign-in
      responses:
        '200': *id001
  /v1/iam/onboard:
    post:
      operationId: onboard
      summary: Create the caller’s first organization and move them into it
