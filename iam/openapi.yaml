      tags:
      - Credentials
      responses:
        '200': *id001
    post:
      operationId: service_accounts_create
      summary: Create a service account — an identity for a program, not a person
      tags:
      - Credentials
      responses:
        '200': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /v1/iam/service-accounts/{name}:
    delete:
      operationId: service_accounts_delete
      summary: Delete a service account
