    Key:
      properties:
        accessKey:
          description: 'AccessKey (pk-*) is the publishable identifier and lookup index;

            AccessSecret (sk-*) is the confidential secret.'
          type: string
        accessSecret:
          type: string
        application:
          type: string
        createdAt:
          format: date-time
          type: string
        createdTime:
          description: 'CreatedTime and UpdatedTime are RFC3339 audit stamps carried as strings

            for byte-parity with the v1 row (orm.Model separately tracks CreatedAt /

            UpdatedAt as time.Time for the store''s own lifecycle).'
          type: string
        deleted:
          type: boolean
        displayName:
          description: DisplayName is the human-facing label.
          type: string
        expireTime:
          description: 'ExpireTime is when the key stops being honored (empty = never). State is

            the lifecycle flag ("Active", "test", …); "test" mints test-env

            credentials instead of live ones.'
          type: string
        id:
          type: string
        name:
          type: string
        organization:
          type: string
        owner:
          description: Owner is the tenant that holds the key; Name is unique within Owner.
          type: string
        scope:
          description: 'Scope is the key''s ACCESS CLASS, orthogonal to Type (which names the bound

            principal). Empty (the default, "secret") is a full key: a pk- publishable

            half AND a confidential sk- half, the sk- authenticating a server-side reader.

            KeyScopePublish is a WRITE-ONLY publishable key — a pk- half only, no secret —

            that resolves to just an ORG (never a principal) at the ingest door and is safe

            to ship in client JS. A missing value on an existing row reads as the default,

            so every pre-Scope key is a secret key unchanged.'
          type: string
        state:
          type: string
        type:
          description: 'Type is the scope the key is bound to — "Organization", "Application",

            "User", or "General" — and Organization / Application / User name the

            concrete principal for whichever scope Type selects.'
          type: string
        updatedAt:
          format: date-time
          type: string
        updatedTime:
          type: string
        user:
          type: string
      type: object
