        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ok
      summary: Changes an organization's display, its defaults and the sign-in rules everyone in it inherits.
      tags:
      - organizations
  /v1/iam/permissions:
    get:
      description: 'Returns the permissions in one organization, newest first — each one a

        grant saying which people or roles may do what, and to which resources.'
      operationId: permissions_list
      parameters:
      - in: query
        name: owner
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/permission.ListResponse'
          description: ok
      summary: Returns the permissions in one organization, newest first — each one a grant saying which
        people or roles may do what, and to which resources.
      tags:
      - permissions
    post:
      description: 'Grants a permission — the call that gives a person or a role the ability to

        do something. Adding refuses to overwrite a grant that already exists, so

        widening an existing one is an update, never an accident.'
      operationId: permissions_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Permission'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
          description: ok
      summary: Grants a permission — the call that gives a person or a role the ability to do something.
      tags:
      - permissions
  /v1/iam/permissions/delete:
    post:
      description: 'Revokes a permission. Everyone who held access only through it loses

        that access immediately; grants they hold by another route are untouched.'
      operationId: permissions_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/permission.Ref'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/permission.DeleteResponse'
          description: ok
      summary: Revokes a permission.
      tags:
      - permissions
  /v1/iam/permissions/get:
    get:
      description: 'Returns one permission: who it grants to, what it allows, and the

        resources it covers.'
      operationId: permissions_get
