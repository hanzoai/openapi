      - Credentials
      responses:
        '200': *id001
      parameters:
      - name: name
        in: path
        required: true
        schema: *id002
  /v1/iam/service-accounts/{name}/keys:
    post:
      operationId: service_accounts_keys_create
      summary: Mint a key for a service account, and return it once
      tags:
      - Credentials
      responses:
        '200': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      parameters:
      - name: name
        in: path
        required: true
        schema: *id002
  /v1/iam/sessions/create:
    post:
      description: 'Records a sign-in. Signing in again from another browser adds to the

        session rather than replacing it, so one person can be signed in from a laptop

        and a phone at once.


        Ask for an exclusive sign-in and the opposite holds: the new sign-in is the only

        one left and every other browser is signed out. That is the setting to use when

        one person may hold only one live session at a time.'
      operationId: sessions_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ok
      summary: Records a sign-in.
      tags:
      - sessions
  /v1/iam/sessions/delete:
    post:
      description: 'Signs a person out of one application — the session ends and every

        browser carrying it stops being authenticated.


        A session that is already gone reports that nothing was deleted rather than an

        error, so the call is safe to repeat.'
      operationId: sessions_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRef'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSessionOut'
          description: ok
      summary: Signs a person out of one application — the session ends and every browser carrying it
        stops being authenticated.
      tags:
      - sessions
  /v1/iam/sessions/get:
    post:
      description: 'Returns one person''s session in one application — when it began and which

        browsers or devices are still carrying it.'
      operationId: sessions_get
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRef'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ok
      summary: Returns one person's session in one application — when it began and which browsers or devices
        are still carrying it.
      tags:
      - sessions
  /v1/iam/sessions/list:
    post:
      description: 'Returns who is currently signed in to your organization, newest first, and

        can be narrowed to one person or one application. It is what you read before

        signing someone out.'
      operationId: sessions_list
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListSessionsIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSessionsOut'
          description: ok
      summary: Returns who is currently signed in to your organization, newest first, and can be narrowed
        to one person or one application.
      tags:
      - sessions
  /v1/iam/sessions/update:
    post:
      description: 'Replaces the set of browsers a session covers — signing out the ones you

        leave off while the session itself stays live. A session that does not exist is

        reported as missing rather than created.'
      operationId: sessions_update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ok
      summary: Replaces the set of browsers a session covers — signing out the ones you leave off while
        the session itself stays live.
      tags:
      - sessions
  /v1/iam/signin:
    post:
      operationId: signin
      summary: Exchange an authorization code for a session
      tags:
      - Sign-in
      responses:
        '200': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      security: []
  /v1/iam/signup:
    post:
      operationId: signup
      summary: Create an account
      tags:
      - Sign-in
      responses:
        '200': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      security: []
  /v1/iam/tokens:
    get:
      description: 'Returns the access tokens issued in your organization, newest

        first, and can be narrowed to one organization. Use it to see what is currently

        authorized before revoking anything.'
      operationId: tokens_list
      parameters:
      - in: query
        name: owner
        required: false
        schema:
          type: string
      - in: query
        name: organization
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listTokensOut'
          description: ok
      summary: Returns the access tokens issued in your organization, newest first, and can be narrowed
        to one organization.
      tags:
      - tokens
    post:
      description: 'Records an access token — the credential an application or integration

        presents on a caller''s behalf.'
      operationId: tokens_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Token'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenResult'
          description: ok
      summary: Records an access token — the credential an application or integration presents on a caller's
        behalf.
      tags:
      - tokens
  /v1/iam/tokens/delete:
    post:
      description: 'Revokes an access token. Whatever was using it stops being

        authorized at once.


        A token that is already gone answers "nothing changed" rather than an error, so

        the call is safe to repeat.'
      operationId: tokens_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tokenKey'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenMutation'
          description: ok
      summary: Revokes an access token.
      tags:
      - tokens
  /v1/iam/tokens/get:
    post:
      description: 'Returns one access token: who and what it was issued to, and when it

        expires.'
      operationId: tokens_get
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tokenKey'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenResult'
          description: ok
      summary: 'Returns one access token: who and what it was issued to, and when it expires.'
      tags:
      - tokens
  /v1/iam/tokens/issue:
    post:
      operationId: tokens_issue
      summary: Mint an access token for a named person
      tags:
      - Credentials
      responses:
        '200': *id001
      description: For a confidential client acting on their behalf. The token carries that person’s identity,
        so a resource server cannot tell it from one they obtained themselves.
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
        description: The person, as `<org>/<username>`.
      - name: aud
        in: query
        required: false
        schema:
          type: string
        description: The resource the token is for.
      security: []
  /v1/iam/tokens/update:
    post:
      description: 'Changes an access token''s scope or expiry.


        A token that is not there answers "nothing changed" rather than an error, so

        the call is safe to repeat.'
      operationId: tokens_update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Token'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenMutation'
          description: ok
      summary: Changes an access token's scope or expiry.
      tags:
      - tokens
  /v1/iam/unlink:
    post:
      operationId: unlink
      summary: Unlink an external identity provider account from this identity
      tags:
      - Sign-in
      responses:
        '200': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /v1/iam/users:
    get:
      description: 'Returns a page of the people in your organization, with the total so you

        can page through the rest. Passwords, API secrets and MFA material are stripped

        from every entry.'
      operationId: users_list
      parameters:
      - in: query
        name: owner
        required: true
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users.ListOutput'
          description: ok
      summary: Returns a page of the people in your organization, with the total so you can page through
        the rest.
      tags:
      - users
    post:
      description: 'Adds a person to your organization. Send a password and it becomes the

        one they sign in with; it is hashed before it is stored and never comes back

        in any response.


        The username is checked against the same rule every account in the Hanzo Cloud

        is held to, whichever way it was created — this call, password signup, a social

        sign-in, or SCIM — so a name accepted here works everywhere.


        A name already taken in your organization is refused rather than overwritten.'
      operationId: users_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ok
      summary: Adds a person to your organization.
      tags:
      - users
  /v1/iam/users/delete:
    post:
      description: 'Removes a person from your organization. Their sessions stop working

        immediately and the account is gone rather than suspended — to keep the record

        and only stop sign-in, update the user instead.'
      operationId: users_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/users.Ref'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users.DeleteOutput'
          description: ok
      summary: Removes a person from your organization.
      tags:
      - users
  /v1/iam/users/get:
    get:
      description: 'Returns one person in your organization, by the organization they belong

        to and their username. Passwords, API secrets and MFA material are stripped

        from the response.'
      operationId: users_get
      parameters:
      - in: query
        name: owner
        required: true
        schema:
          type: string
      - in: query
        name: name
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ok
      summary: Returns one person in your organization, by the organization they belong to and their username.
      tags:
      - users
  /v1/iam/users/update:
    post:
      description: 'Changes a person''s profile, their roles, or the credentials they sign

        in with. Send a password to reset it; leave it out and their current one keeps

        working.


        Who they are does not change: their organization, username and the identifier

        their existing sessions are keyed on all survive the write, so an update never

        signs anyone out.'
      operationId: users_update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ok
      summary: Changes a person's profile, their roles, or the credentials they sign in with.
      tags:
      - users
  /v1/iam/verification-codes:
    post:
      operationId: verification_codes_create
      summary: Send a one-time code to an email address or phone number
      tags:
      - Sign-in
      responses:
        '200': *id001
      security: []
  /v1/iam/web3/nonce:
    get:
      operationId: web3_nonce
      summary: Get the nonce a wallet signs to prove it holds an address
      tags:
      - Sign-in
      responses:
        '200': *id001
      security: []
  /v1/iam/web3/verify:
    post:
      operationId: web3_verify
      summary: Verify a wallet signature and sign the holder in
      tags:
      - Sign-in
      responses:
        '200': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      security: []
  /v1/iam/webauthn-credentials:
    get:
      description: 'Returns the passkeys and security keys registered in

        your organization, newest first — which device each belongs to and when it was

        last used.'
      operationId: webauthn_credentials_list
      parameters:
      - in: query
        name: owner
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listWebauthnCredentialsOut'
          description: ok
      summary: Returns the passkeys and security keys registered in your organization, newest first —
        which device each belongs to and when it was last used.
      tags:
      - webauthn-credentials
    post:
      description: 'Registers a passkey or security key for a person, so they

        can sign in with their device instead of a password.'
      operationId: webauthn_credentials_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebauthnCredential'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webauthnCredentialResult'
          description: ok
      summary: Registers a passkey or security key for a person, so they can sign in with their device
        instead of a password.
      tags:
      - webauthn-credentials
  /v1/iam/webauthn-credentials/delete:
    post:
      description: 'Removes a passkey or security key — what you call when

        a device is lost. Make sure the person has another way to sign in first.


        A credential that is already gone answers "nothing changed" rather than an

        error, so the call is safe to repeat.'
      operationId: webauthn_credentials_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/webauthnCredentialKey'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webauthnCredentialMutationResult'
          description: ok
      summary: Removes a passkey or security key — what you call when a device is lost.
      tags:
      - webauthn-credentials
  /v1/iam/webauthn-credentials/get:
    post:
      description: 'Returns one passkey or security key: whose it is, what

        device it lives on, and when it was registered.'
      operationId: webauthn_credentials_get
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/webauthnCredentialKey'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webauthnCredentialResult'
          description: ok
      summary: 'Returns one passkey or security key: whose it is, what device it lives on, and when it
        was registered.'
      tags:
      - webauthn-credentials
  /v1/iam/webauthn-credentials/update:
    post:
      description: 'Renames a registered passkey or security key, so a

        person can tell their devices apart.


        A credential that is not there answers "nothing changed" rather than an error,

        so the call is safe to repeat.'
      operationId: webauthn_credentials_update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebauthnCredential'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webauthnCredentialMutationResult'
          description: ok
      summary: Renames a registered passkey or security key, so a person can tell their devices apart.
      tags:
      - webauthn-credentials
  /v1/iam/whoami:
    get:
      operationId: whoami
      summary: Report who the caller is
      tags:
      - Account
      responses:
        '200': *id001
  /v1/iam/workspaces:
    get:
      description: 'Returns your organization''s workspaces, newest first — the scope a

        team works in, alongside projects rather than instead of them.


        You see your own organization''s workspaces and no one else''s; which organization that

        is comes from your credentials, not from the request.'
      operationId: workspaces_list
      parameters:
      - in: query
        name: owner
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workspaces.ListOutput'
          description: ok
      summary: Returns your organization's workspaces, newest first — the scope a team works in, alongside
        projects rather than instead of them.
      tags:
      - workspaces
    post:
      description: 'Makes a workspace inside your organization — the scope a team works in,

        alongside projects rather than instead of them. A name already used in the

        organization is refused.'
      operationId: workspaces_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/workspaces.Input'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ok
      summary: Makes a workspace inside your organization — the scope a team works in, alongside projects
        rather than instead of them.
      tags:
      - workspaces
  /v1/iam/workspaces/delete:
    post:
      description: 'Removes a workspace. The people and roles in your organization are

        unchanged; what goes is the scope itself.'
      operationId: workspaces_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/workspaces.Ref'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workspaces.DeleteOutput'
          description: ok
      summary: Removes a workspace.
      tags:
      - workspaces
  /v1/iam/workspaces/get:
    post:
      description: 'Returns one workspace: what it is called and how it is set up.'
      operationId: workspaces_get
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/workspaces.Ref'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ok
      summary: 'Returns one workspace: what it is called and how it is set up.'
      tags:
      - workspaces
  /v1/iam/workspaces/update:
    post:
      description: 'Changes a workspace''s settings. What it is called does not change, and

        neither does when it was created.'
      operationId: workspaces_update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/workspaces.Input'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ok
      summary: Changes a workspace's settings.
      tags:
      - workspaces
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AccountItem:
      properties:
        modifyRule:
          type: string
        name:
          type: string
        regex:
          type: string
        tab:
          type: string
        viewRule:
          type: string
        visible:
          type: boolean
      type: object
    Address:
      properties:
        city:
          type: string
        line1:
          type: string
        line2:
          type: string
        region:
          type: string
        state:
          type: string
        tag:
          type: string
        zipCode:
          type: string
      type: object
    Application:
      properties:
        affiliationUrl:
          type: string
        category:
          type: string
        cert:
          type: string
        certObj:
          $ref: '#/components/schemas/Cert'
        certPublicKey:
          type: string
        clientCert:
          type: string
        clientId:
          description: 'ClientId is the OAuth2/OIDC client identifier and the GLOBAL key every

            confidential-client resolver authenticates against (store.GetApplicationByClientId,

            the mint gates, Basic auth). It MUST be globally unique across ALL owners — a

            collision would let one app shadow another at that key. This store persists each

            entity as a JSON document in a shared table, so there is no per-field column to

            carry a DB UNIQUE index; uniqueness is enforced at the write in

            applications.Create/Update (ensureClientIdUnique), exactly as the (owner,name)

            natural key is, and store.GetApplicationByClientId resolves admin-preferring as

            defense-in-depth.'
          type: string
        clientSecret:
          type: string
        codeResendTimeout:
          type: integer
        cookieExpireInHours:
          type: integer
        createdAt:
          format: date-time
          type: string
        createdTime:
          type: string
        customScopes:
          items:
            $ref: '#/components/schemas/ScopeDescription'
          type: array
        defaultGroup:
          type: string
        deleted:
          type: boolean
        description:
          type: string
        disableSamlAttributes:
          type: boolean
        disableSignin:
          type: boolean
        displayName:
          type: string
        domain:
          type: string
        enableAutoSignin:
          type: boolean
        enableCodeSignin:
          type: boolean
        enableExclusiveSignin:
          type: boolean
        enableLinkWithEmail:
          type: boolean
        enablePassword:
          type: boolean
        enableSamlAssertionSignature:
          type: boolean
        enableSamlC14n10:
          type: boolean
        enableSamlCompress:
          type: boolean
        enableSamlPostBinding:
          type: boolean
        enableSignUp:
          type: boolean
        enableSigninSession:
          type: boolean
        enableWebAuthn:
          type: boolean
        environment:
          type: string
        expireInHours:
          type: number
        failedSigninFrozenTime:
          type: integer
        failedSigninLimit:
          type: integer
        favicon:
          type: string
        footerHtml:
          type: string
        forcedRedirectOrigin:
          type: string
        forgetUrl:
          type: string
        formBackgroundUrl:
          type: string
        formBackgroundUrlMobile:
          type: string
        formCss:
          type: string
        formCssMobile:
          type: string
        formOffset:
          type: integer
        formSideHtml:
          type: string
        grantTypes:
          items:
            type: string
          type: array
        headerHtml:
          type: string
        homepageUrl:
          type: string
        id:
          type: string
        ipRestriction:
          type: string
        ipWhitelist:
          type: string
        isShared:
          type: boolean
        logo:
          type: string
        name:
          type: string
        order:
          type: integer
        orgChoiceMode:
          type: string
        organization:
          type: string
        organizationObj:
          $ref: '#/components/schemas/Organization'
        otherDomains:
          items:
            type: string
          type: array
        owner:
          type: string
        project:
          type: string
        providers:
          items:
            $ref: '#/components/schemas/ProviderItem'
          type: array
        redirectUris:
          items:
            type: string
          type: array
        refreshExpireInHours:
