      - organizations
  /v1/iam/organizations/delete:
    post:
      description: 'Removes an organization and everything named inside it. There is no

        undo, and every session issued under it stops working.


        The built-in admin organization cannot be deleted — losing it would leave the

        account with no way back in.'
      operationId: organizations_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteOrganizationInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteOrganizationOutput'
          description: ok
      summary: Removes an organization and everything named inside it.
      tags:
      - organizations
  /v1/iam/organizations/get:
    get:
      description: 'Returns one organization: its display, its defaults and the sign-in rules

        everyone in it inherits.'
      operationId: organizations_get
      parameters:
      - in: query
        name: owner
        required: false
        schema:
          type: string
      - in: query
        name: name
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ok
      summary: 'Returns one organization: its display, its defaults and the sign-in rules everyone in
        it inherits.'
      tags:
      - organizations
  /v1/iam/organizations/update:
    post:
      description: 'Changes an organization''s display, its defaults and the sign-in rules

        everyone in it inherits. Which organization it is does not change, and neither

