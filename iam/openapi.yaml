    post:
      description: 'Removes a project. The people and roles in your organization are

        unchanged; what goes is the scope itself, so move anything addressed by it

        first.'
      operationId: projects_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/projects.Ref'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/projects.DeleteOutput'
          description: ok
