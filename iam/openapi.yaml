          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
          description: ok
      summary: 'Returns one permission: who it grants to, what it allows, and the resources it covers.'
      tags:
      - permissions
  /v1/iam/permissions/update:
    post:
      description: 'Changes who a permission grants to, what it allows, or the resources it

        covers. Access changes as soon as the write lands. What the permission is

        called does not change, and neither does when it was created.'
      operationId: permissions_update
      requestBody:
        content:
          application/json:
