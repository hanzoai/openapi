      - roles
  /v1/iam/roles/get:
    post:
      description: 'Returns one role: who is in it, and the roles it includes.'
      operationId: roles_get
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/roles.Ref'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: ok
      summary: 'Returns one role: who is in it, and the roles it includes.'
