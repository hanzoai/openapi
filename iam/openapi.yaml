      operationId: roles_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/roles.Input'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: ok
      summary: Makes a role — a named group of people that permissions are granted to.
      tags:
      - roles
  /v1/iam/roles/delete:
    post:
      description: 'Removes a role. Everyone in it loses the access it carried; their

        accounts, and any other role they hold, are untouched.'
      operationId: roles_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/roles.Ref'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/roles.DeleteOutput'
          description: ok
      summary: Removes a role.
