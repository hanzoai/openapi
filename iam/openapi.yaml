      - projects
    post:
      description: 'Makes a project inside your organization — the scope people pick

        between when their work is separated by product or client rather than by team.

        A name already used in the organization is refused.'
      operationId: projects_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Input'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ok
      summary: Makes a project inside your organization — the scope people pick between when their work
        is separated by product or client rather than by team.
