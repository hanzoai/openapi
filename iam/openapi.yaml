      operationId: projects_update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Input'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ok
      summary: Changes a project's settings.
      tags:
      - projects
  /v1/iam/providers:
    get:
      description: 'Returns your organization''s providers, newest first — the

        identity providers your people sign in with, and the senders and connectors

        your applications go through.


        You see your own organization''s providers and no one else''s; which organization

        that is comes from your credentials, not from the request.'
      operationId: providers_list
      parameters:
      - in: query
        name: owner
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listProvidersOut'
          description: ok
      summary: Returns your organization's providers, newest first — the identity providers your people
        sign in with, and the senders and connectors your applications go through.
      tags:
      - providers
    post:
      description: 'Adds an identity provider your people can sign in with, or a

        service your applications send through — a social or enterprise login, an email

        or SMS sender, a storage or payment connector.


        A provider is configured once and then switched on per application, so several

        applications can share one set of credentials.'
      operationId: providers_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Provider'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/providerResult'
          description: ok
      summary: Adds an identity provider your people can sign in with, or a service your applications
        send through — a social or enterprise login, an email or SMS sender, a storage or payment connector.
      tags:
      - providers
  /v1/iam/providers/delete:
    post:
      description: 'Removes a provider. Sign-in through it stops for every

        application that used it, so give those applications another method first.


        A provider that is already gone answers "nothing changed" rather than an

        error, so the call is safe to repeat.'
      operationId: providers_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/providerKey'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mutationResult'
          description: ok
      summary: Removes a provider.
      tags:
      - providers
  /v1/iam/providers/get:
    post:
      description: 'Returns one provider: what it connects to and how it is

        configured. Its credentials come back masked.'
      operationId: providers_get
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/providerKey'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/providerResult'
          description: ok
      summary: 'Returns one provider: what it connects to and how it is configured.'
      tags:
      - providers
  /v1/iam/providers/update:
    post:
      description: 'Changes a provider''s settings or rotates the credentials it

        holds. The change takes effect on the next sign-in through it — sessions

        already issued are unaffected.


        A provider that is not there answers "nothing changed" rather than an error, so

        the call is safe to repeat.'
      operationId: providers_update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Provider'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mutationResult'
          description: ok
      summary: Changes a provider's settings or rotates the credentials it holds.
      tags:
      - providers
