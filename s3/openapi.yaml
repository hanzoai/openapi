openapi: 3.1.0
info:
  title: Hanzo S3 API
  description: 'Hanzo S3 provides S3-compatible object storage for AI infrastructure.

    Compatible with all AWS S3 SDKs (boto3, @aws-sdk/client-s3, aws-sdk-go).


    Features:

    - Full S3 API compatibility

    - Object versioning and lifecycle management

    - Erasure coding with configurable redundancy

    - Server-side encryption (SSE-S3 and SSE-KMS)

    - Bucket policies and IAM integration

    - Event notifications on object mutations

    - OIDC SSO via hanzo.id for console access

    '
  version: 8.0.0
  contact:
    name: Hanzo AI
    url: https://hanzo.ai
    email: support@hanzo.ai
  license:
    name: Proprietary
servers:
- url: https://s3.hanzo.ai
  description: S3 Production
- url: https://api.hanzo.ai
  description: Hanzo Gateway (via api.hanzo.ai/v1/s3/*)
tags:
- name: Buckets
  description: Bucket management
- name: Objects
  description: Object CRUD operations
- name: Versioning
  description: Object versioning
- name: Lifecycle
  description: Lifecycle management rules
- name: Policies
  description: Bucket access policies
- name: Encryption
  description: Server-side encryption configuration
- name: Events
  description: Event notification configuration
- name: s3
security:
- BearerAuth: []
components:
  parameters:
    Name:
      name: name
      in: path
      required: true
      description: |
        The user-supplied resource name (slug). Lowercased and trimmed server-side;
        must match `^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$`.
      schema:
        type: string
        pattern: '^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$'
  requestBodies:
    CreateResource:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateRequest'
  responses:
    BadGateway:
      description: The backend provisioner or dedicated-instance operation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid name or malformed request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: A resource with this name (or physical name) already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Created:
      description: Resource provisioned. Password (if any) is returned ONCE here.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateResponse'
    Deleted:
      description: Resource deprovisioned. No content.
    Forbidden:
      description: No validated principal, or empty org without admin claim.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaymentRequired:
      description: Org balance gate failed (unfunded org).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Resource:
      description: Resource metadata (never a password).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GetResponse'
    ResourceList:
      description: The caller's org resources of this kind (never a password).
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ListItem'
    ServiceUnavailable:
      description: |
        Kind is honestly gated (cannot grant a per-tenant-safe credential), or the
        cluster orchestrator is unavailable for a dedicated kind, or commerce is
        unreachable in the fail-closed posture.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    s3Auth:
      type: apiKey
      in: header
      name: Authorization
      description: 'AWS Signature Version 4 authentication.

        Use your Hanzo S3 access key and secret key.

        '
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: HANZO_API_KEY
      description: Hanzo API Key (Bearer hk-...)
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Bearer JWT issued by Hanzo IAM (https://hanzo.id). Discovery: https://hanzo.id/.well-known/openid-configuration.
        Obtain via /v1/iam/auth/login, /oauth/token, or the API key UI on hanzo.id.'
  schemas:
    CreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$'
          description: Resource name (lowercased/trimmed server-side).
          example: analytics
    CreateResponse:
      type: object
      description: |
        Returned on 201. `password` and `username` are present only for secretful
        kinds (sql, kv, and the dedicated datastore/docdb admin credential). The
        password is returned ONCE and is never retrievable again.
      required: [id, kind, name, status, host, port, database, connectionString]
      properties:
        id:
          type: string
          description: Server-generated resource id.
        kind:
          type: string
          enum: [sql, vector, datastore, kv, search, s3, docdb]
        name:
          type: string
        status:
          type: string
          description: Resource status (e.g. "ready", or "provisioning" for a dedicated instance still coming up).
          example: ready
        host:
          type: string
          description: Customer-facing host (public gateway host, or dedicated instance service).
        port:
          type: integer
        username:
          type: string
          description: Present only for secretful kinds.
        database:
          type: string
        connectionString:
          type: string
          description: Public, routable DSN (internal admin host is remapped out).
        password:
          type: string
          description: Present only for secretful kinds; returned ONCE.
    Error:
      type: object
      properties:
        Code:
          type: string
        Message:
          type: string
        Resource:
          type: string
        RequestId:
          type: string
    Bucket:
      type: object
      properties:
        name:
          type: string
          example: my-models
        creation_date:
          type: string
          format: date-time
        size:
          type: integer
          description: Total size in bytes
        objects:
          type: integer
          description: Number of objects
    GetResponse:
      type: object
      required: [id, name, kind, status, host, port, database]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [sql, vector, datastore, kv, search, s3, docdb]
        status:
          type: string
          example: ready
        host:
          type: string
        port:
          type: integer
        username:
          type: string
          description: Present only for secretful kinds.
        database:
          type: string
    ListItem:
      type: object
      required: [id, name, kind, status, host, port, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [sql, vector, datastore, kv, search, s3, docdb]
        status:
          type: string
          example: ready
        host:
          type: string
        port:
          type: integer
        createdAt:
          type: integer
          format: int64
          description: Unix seconds.
    ObjectInfo:
      type: object
      properties:
        key:
          type: string
          example: v1/model.safetensors
        size:
          type: integer
        etag:
          type: string
        content_type:
          type: string
        last_modified:
          type: string
          format: date-time
        version_id:
          type: string
        storage_class:
          type: string
          enum:
          - STANDARD
          - REDUCED_REDUNDANCY
          - GLACIER
    BucketPolicy:
      type: object
      properties:
        Version:
          type: string
          example: '2012-10-17'
        Statement:
          type: array
          items:
            type: object
            properties:
              Sid:
                type: string
              Effect:
                type: string
                enum:
                - Allow
                - Deny
              Principal:
                type: string
              Action:
                type: array
                items:
                  type: string
              Resource:
                type: array
                items:
                  type: string
              Condition:
                type: object
    LifecycleRule:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - Enabled
          - Disabled
        prefix:
          type: string
        expiration:
          type: object
          properties:
            days:
              type: integer
            date:
              type: string
              format: date
        transition:
          type: object
          properties:
            days:
              type: integer
            storage_class:
              type: string
    VersioningConfig:
      type: object
      properties:
        status:
          type: string
          enum:
          - Enabled
          - Suspended
    EncryptionConfig:
      type: object
      properties:
        sse_algorithm:
          type: string
          enum:
          - AES256
          - aws:kms
        kms_master_key_id:
          type: string
          description: KMS key ID for SSE-KMS
    EventConfig:
      type: object
      properties:
        id:
          type: string
        events:
          type: array
          items:
            type: string
            enum:
            - s3:ObjectCreated:*
            - s3:ObjectRemoved:*
            - s3:ObjectAccessed:*
        filter:
          type: object
          properties:
            prefix:
              type: string
            suffix:
              type: string
        destination:
          type: object
          properties:
            type:
              type: string
              enum:
              - webhook
              - pubsub
              - mq
            url:
              type: string
    ServiceAccount:
      type: object
      properties:
        access_key:
          type: string
        secret_key:
          type: string
        policy:
          $ref: '#/components/schemas/BucketPolicy'
        status:
          type: string
          enum:
          - enabled
          - disabled
        created_at:
          type: string
          format: date-time
    UsageInfo:
      type: object
      properties:
        total_size:
          type: integer
          description: Total storage in bytes
        total_objects:
          type: integer
        buckets:
          type: integer
paths:
  /v1/s3:
    post:
      tags: [s3]
      operationId: createS3
      summary: Provision an object-storage bucket
      requestBody:
        $ref: '#/components/requestBodies/CreateResource'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      tags: [s3]
      operationId: listS3
      summary: List object-storage buckets for the caller's org
      responses:
        '200': { $ref: '#/components/responses/ResourceList' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/s3/:
    get:
      operationId: listBuckets
      summary: List all buckets
      description: Returns a list of all buckets owned by the authenticated user.
      tags:
      - Buckets
      responses:
        '200':
          description: Bucket list
          content:
            application/json:
              schema:
                type: object
                properties:
                  buckets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bucket'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/s3/{bucket}:
    put:
      operationId: createBucket
      summary: Create a bucket
      tags:
      - Buckets
      parameters:
      - name: bucket
        in: path
        required: true
        schema:
          type: string
        example: my-models
      responses:
        '200':
          description: Bucket created
        '409':
          description: Bucket already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listObjectsV2
      summary: List objects in bucket
      tags:
      - Objects
      parameters:
      - name: bucket
        in: path
        required: true
        schema:
          type: string
      - name: prefix
        in: query
        schema:
          type: string
        description: Filter by key prefix
      - name: delimiter
        in: query
        schema:
          type: string
        description: Grouping delimiter (e.g. /)
      - name: max-keys
        in: query
        schema:
          type: integer
          default: 1000
      - name: continuation-token
        in: query
        schema:
          type: string
        description: Pagination token from previous response
      responses:
        '200':
          description: Object listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  prefix:
                    type: string
                  contents:
                    type: array
                    items:
                      $ref: '#/components/schemas/ObjectInfo'
                  common_prefixes:
                    type: array
                    items:
                      type: object
                      properties:
                        prefix:
                          type: string
                  is_truncated:
                    type: boolean
                  next_continuation_token:
                    type: string
    delete:
      operationId: deleteBucket
      summary: Delete a bucket
      description: Bucket must be empty before deletion.
      tags:
      - Buckets
      parameters:
      - name: bucket
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Bucket deleted
        '409':
          description: Bucket not empty
  /v1/s3/{bucket}?versioning:
    get:
      operationId: getBucketVersioning
      summary: Get versioning status
      tags:
      - Versioning
      parameters:
      - name: bucket
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Versioning configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersioningConfig'
    put:
      operationId: putBucketVersioning
      summary: Set versioning status
      tags:
      - Versioning
      parameters:
      - name: bucket
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersioningConfig'
      responses:
        '200':
          description: Versioning updated
  /v1/s3/{bucket}?lifecycle:
    get:
      operationId: getBucketLifecycle
      summary: Get lifecycle rules
      tags:
      - Lifecycle
      parameters:
      - name: bucket
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Lifecycle configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    type: array
                    items:
                      $ref: '#/components/schemas/LifecycleRule'
    put:
      operationId: putBucketLifecycle
      summary: Set lifecycle rules
      tags:
      - Lifecycle
      parameters:
      - name: bucket
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rules:
                  type: array
                  items:
                    $ref: '#/components/schemas/LifecycleRule'
      responses:
        '200':
          description: Lifecycle updated
  /v1/s3/{bucket}?policy:
    get:
      operationId: getBucketPolicy
      summary: Get bucket policy
      tags:
      - Policies
      parameters:
      - name: bucket
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Bucket policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketPolicy'
    put:
      operationId: putBucketPolicy
      summary: Set bucket policy
      tags:
      - Policies
      parameters:
      - name: bucket
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BucketPolicy'
      responses:
        '200':
          description: Policy set
  /v1/s3/{bucket}?encryption:
    get:
      operationId: getBucketEncryption
      summary: Get encryption configuration
      tags:
      - Encryption
      parameters:
      - name: bucket
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Encryption config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncryptionConfig'
    put:
      operationId: putBucketEncryption
      summary: Set encryption configuration
      tags:
      - Encryption
      parameters:
      - name: bucket
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncryptionConfig'
      responses:
        '200':
          description: Encryption configured
  /v1/s3/{bucket}?notification:
    get:
      operationId: getBucketNotification
      summary: Get event notification config
      tags:
      - Events
      parameters:
      - name: bucket
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Notification config
          content:
            application/json:
              schema:
                type: object
                properties:
                  configurations:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventConfig'
    put:
      operationId: putBucketNotification
      summary: Set event notification config
      tags:
      - Events
      parameters:
      - name: bucket
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                configurations:
                  type: array
                  items:
                    $ref: '#/components/schemas/EventConfig'
      responses:
        '200':
          description: Notifications configured
  /v1/s3/{name}:
    parameters:
    - $ref: '#/components/parameters/Name'
    get:
      tags: [s3]
      operationId: getS3
      summary: Get one object-storage bucket
      responses:
        '200': { $ref: '#/components/responses/Resource' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [s3]
      operationId: deleteS3
      summary: Deprovision an object-storage bucket
      responses:
        '204': { $ref: '#/components/responses/Deleted' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
