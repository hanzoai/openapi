# capabilities.yaml — the ONE editorial decision left in this repo.
#
# NOT a registry of what exists. hanzo-inc/cloud decides that, by registering a
# route; `hanzo.yaml` reports it. This file answers the one question the document
# does not: which DOMAIN a capability belongs under when a reader is shown the
# whole API at once. That is presentation, and presentation has no source in the
# code — a doc site's movements are a taste decision about a reader, not a fact
# about a router.
#
# It is curation over the document, and curation is gated BOTH ways by
# publish.py:
#
#   • a capability the document carries and this file does not group FAILS the
#     publish. A new product is a name somebody has to place, and letting one
#     default into a bucket is how 235 tags once ended up ungrouped while the
#     doc site rendered four.
#   • a name grouped here that the document does NOT carry FAILS too. Nothing
#     serves it, so nothing can be filed under it — and a name that outlives its
#     routes is exactly the drift this repo was rebuilt to make impossible.
#
# So the list below cannot describe an API other than the one that is served. It
# can only be a worse or better arrangement of the one that is.
#
# `tags:` are the tags OPERATIONS CARRY in cloud's emission — the product, which
# is the first path segment after /v1/, or the owning Go package where a route
# has no /v1 prefix. They are not directory names. There are no directories.

domains:
  - id: identity
    title: "Identity & Trust"
    role: "who you are · what you may touch · where secrets live"
    # `avatar` is a profile photo, and a profile photo is a fact about WHO YOU
    # ARE: the upload writes the URL into the user's IAM record, so it belongs
    # beside iam and not under a storage or media heading.
    # `appearance` is the same argument as `avatar` one field over: text size,
    # density and accent are read from and written to the caller's IAM account,
    # which is why they follow the person to every device and every Hanzo
    # surface. A per-app setting would live with `prefs`; this one cannot,
    # because there is one of it per identity and not one per app.
    tags: [iam, admin, authz, kms, security, keys, csrf, org, orgs, team,
           audit, compliance, risk, validators, wallets, entitlements, avatar,
           appearance]

  - id: intelligence
    title: "Intelligence"
    role: "models · agents · evaluation — the mind of the cloud"
    # The bare-/v1 inference surface (chat, completions, embeddings, messages,
    # rerank, models, images, audio, videos, responses) is Hanzo AI's OpenAI- and
    # Anthropic-compatible door: there the PATH is the compatibility contract,
    # because every vendor SDK hard-codes it. It is served by cloud like
    # everything else — measured with nonsense-sibling controls: GET /v1/models
    # 200 while /v1/models-zzq9 404s, POST /v1/chat/completions 401 while its
    # sibling 404s. There is no edge exception and there never was.
    #
    # The long tail here (query, query_multiple, install-patch, dev-bridge,
    # wecom-bot, traffic, docs, health, feedback, documents) is SHRAPNEL from one
    # seam, not ten products: apps/ai relays a whole embedded router through one
    # door and hand-declares the operations behind it, so its declarations tag
    # themselves. Those names disappear from this file the release apps/ai
    # projects the mounted registry instead — `provider-flags` already has.
    tags: [ai, router, agent, agents, ml, finetune, evals, benchmark,
           research, prompts, exec, sandboxes, coding, files, upload, download, mcp, tools, skills,
           ask, code, memory, rag, engine, run, runner, chat, completions,
           embeddings, messages, rerank, models, images, audio, videos,
           responses, translate, summary, documents, docs, feedback,
           generate-text-to-speech-audio, generate-text-to-speech-audio-stream,
           process-speech-to-text, query, query_multiple, dev-bridge,
           install-patch, traffic, wecom-bot, health]

  - id: data
    title: "Data"
    role: "the stores every capability writes to and reads from"
    # `taxonomy` is the classification the console reads to arrange products —
    # a stored vocabulary that other capabilities look terms up in, which is
    # the same shape as `catalog` and `kb` and not a surface of its own.
    tags: [s3, base, kv, vector, sql, datastore, docdb, search,
           index, indexers, oracles, kb, catalog, taxonomy, sync, crawl,
           scrape, websearch]

  - id: streams
    title: "Streams"
    role: "messaging · durable tasks · async orchestration"
    # `tel` is the carrier leg of the delivery `notify` already names: notify is
    # "transactional email and SMS, sent through your org's own provider
    # credential", and tel holds the numbers that SMS leaves from and the calls
    # that share the carrier with it. It files here rather than under
    # Applications because a call is a message reaching a person over somebody
    # else's network, not a surface of its own.
    # `git-webhook` is the door Hanzo Git pushes through, not a thing anybody
    # opens: one POST that a push fires, which starts a build. Its family is
    # `webhooks` and `event` — inbound async — rather than `git`, which is the
    # surface a person uses.
    tags: [tasks, pubsub, mq, notify, tel, automations, auto, flow, webhooks,
           git-webhook, event, channels, destinations, tags, connectors, pipelines]

  - id: observability
    title: "Observability"
    role: "see everything — telemetry · analytics · usage"
    # `commands` arrived at cloud@v1.801.476 as one route, GET /v1/commands,
    # served by the same app as /v1/openapi.json and derived from it: the same
    # operations with the schemas dropped, small enough for a palette to load.
    # A projection of the document sits beside the document.
    #
    # `replay` is session replay, and the document places it without being
    # asked: its tag carries package analytics' own synopsis — "send an event,
    # read back who did what". A recording is that read-back with the frames
    # kept, so it files where the events it replays already file.
    tags: [o11y, sentry, logs, traces, metrics, errors, analytics, insights,
           usage, openapi, commands, replay]

  - id: commerce
    title: "Commerce"
    role: "the economy — meter · price · bill · reward"
    # `payments` arrived at cloud@v1.801.452 as two routes — /v1/payments and
    # /v1/payments/{id}. It is the settlement leg, not a second billing: billing
    # meters and prices what was used, payments records the money that moved for
    # it. Same domain, so the reader sees them together.
    #
    # `cart` is the same story one step earlier: its tag carries package
    # commerce's synopsis — "checkout, subscriptions, invoices, spend alerts,
    # payment webhooks and the storefront catalog" — so it is the pre-checkout
    # leg of the surface `commerce` already names, not a product of its own.
    tags: [commerce, cart, store, marketplace, billing, payments, pricing, plans,
           finance, books, captable, crm, referrals, affiliates, authors,
           licensing, x402, marketing, campaign, ads, experiments, enablement]

  - id: platform
    title: "Platform"
    role: "the cloud fabric — deploy · provision · route · host"
    tags: [platform, cloud, deploy, projects, sites, builds, releases,
           environments, registry, gateway, ingress, dns, domain, cloudflare,
           networks, vpcs, balancers, mesh, k8s, clusters, machines, compute,
           gpus, fleet, plugins, flags]

  - id: applications
    title: "Applications"
    role: "the user-facing surfaces built on all of the above"
    # `todo` is a list a person keeps — a surface, which is what this domain
    # is for. It is NOT streams' `tasks`: that one is the durable async queue
    # work is handed to. Two words, two things, and the only thing they share
    # is the English.
    tags: [git, templates, blueprint, integrations, bot, bots, world, todo, framework, content, guide, help, meet, share, social, links,
           esign, dataroom, company, legal, prefs, settings, embed, functions,
           sbom]

  - id: chain
    title: "Chain"
    role: "the networks the cloud speaks to — enumerate · call · read balances"
    # Three tags, one product: `chains` lists the networks and describes one,
    # `rpc` is the JSON-RPC call against a named chain, and `tokens` reads a
    # holder's balances on it. They are not Platform — that is the fabric this
    # cloud RUNS on, and a chain is something it TALKS TO — and they are not
    # Data, which would file the call that mutates a chain under reads.
    tags: [chains, rpc, tokens]
