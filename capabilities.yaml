# capabilities.yaml — the ONE editorial decision left in this repo.
#
# NOT a registry of what exists. hanzoai/cloud decides that, by registering a
# route; `hanzo.yaml` reports it. This file answers the one question the document
# does not: which DOMAIN a capability belongs under when a reader is shown the
# whole API at once. That is presentation, and presentation has no source in the
# code — a doc site's movements are a taste decision about a reader, not a fact
# about a router.
#
# It is curation over the document, and curation is gated BOTH ways by
# publish.py:
#
#   • a capability the document carries and this file does not group FAILS the
#     publish. A new product is a name somebody has to place, and letting one
#     default into a bucket is how 235 tags once ended up ungrouped while the
#     doc site rendered four.
#   • a name grouped here that the document does NOT carry FAILS too. Nothing
#     serves it, so nothing can be filed under it — and a name that outlives its
#     routes is exactly the drift this repo was rebuilt to make impossible.
#
# So the list below cannot describe an API other than the one that is served. It
# can only be a worse or better arrangement of the one that is.
#
# `tags:` are the tags OPERATIONS CARRY in cloud's public document, and a tag is
# the CAPABILITY that serves the operation — the app, one word, the same word
# that names its Go package, its plugin binary, its address prefix, its client
# class, its tool, its command group, its page and its HIP (HIP-0139). An app
# that still answers at an address not named for it is listed in cloud's
# `openapi/misfiled.txt`, a ratchet that only shrinks; nothing about that is
# expressible here, and nothing here should try.

domains:
  - id: identity
    title: "Identity & Trust"
    role: "who you are · what you may touch · where secrets live"
    # `account` is the caller's own profile: keys, appearance, avatar, the
    # org they onboard into. It sits beside iam because it is the person,
    # read and written through their IAM record.
    # `dataset`, `label` and `reference` are the three stores the risk engine
    # decides from — the evidence, the verdicts people attached to it, and the
    # published lookup data no org could derive alone. They file with risk.
    tags: [iam, account, authz, kms, security, entitlements, audit, compliance,
           risk, dataset, label, reference, validators, wallets, team]

  - id: intelligence
    title: "Intelligence"
    role: "models · agents · evaluation — the mind of the cloud"
    # `ai` is the inference door, including the OpenAI- and Anthropic-compatible
    # wire (chat, completions, embeddings, messages, models, images, audio,
    # videos, responses, rerank): those paths are fixed by the vendor SDKs that
    # hard-code them, and they are ai's and nobody else's (HIP-0139 §3.2).
    # `exec` runs code in a sandbox lease; `sandboxes` is the lease. `tools`
    # is the per-tenant tool plane an agent calls through; `lsp` is code
    # intelligence over a repository, which is why it files beside `code`.
    tags: [ai, engine, ml, agents, evals, benchmark, research, prompts, exec,
           sandboxes, tools, ask, code, lsp, translate]

  - id: data
    title: "Data"
    role: "the stores every capability writes to and reads from"
    # `provisioning` hands out managed datastore instances; `storage` is the
    # object store's bucket plane (it answers at /v1/s3 because S3 is a protocol
    # every client already speaks). `product` is the search and vector
    # catalogue; `knowledge` the knowledge base; `index` the in-binary index
    # speaking the Meilisearch dialect. `taxonomy` is the classification other
    # capabilities look terms up in, `catalog` the cross-org corpus of
    # everything the fleet has built.
    tags: [base, provisioning, storage, product, search, index, knowledge,
           catalog, taxonomy, sync, crawl, websearch]

  - id: streams
    title: "Streams"
    role: "messaging · durable tasks · async orchestration"
    # `tel` is the carrier leg of the delivery `notify` names: the numbers SMS
    # leaves from and the calls that share the carrier with it. `integrations`
    # holds a user's own credentials to outside systems (connectors) and the
    # providers the fleet connects to; `channels` is one inbox across them.
    tags: [tasks, pubsub, mq, notify, tel, automations, flow, webhooks,
           channels, destinations, integrations]

  - id: observability
    title: "Observability"
    role: "see everything — telemetry · analytics · usage"
    # `openapi` is the document itself and its projections (the command palette,
    # the agent door) — the capability that describes the others. `metrics` is
    # the native metrics, logs and traces store; `o11y` the full observability
    # plane over it. `leaderboard` is usage ranked across an org.
    tags: [o11y, metrics, analytics, usage, leaderboard, openapi]

  - id: commerce
    title: "Commerce"
    role: "the economy — meter · price · bill · reward"
    # `commerce` is the ledger and the storefront; `billing` the customer's
    # balance and invoices read over it; `treasury` the reserve behind every
    # payout; `plan` the plan catalog; `pricing` what each unit costs.
    tags: [commerce, billing, treasury, plan, pricing, allowance, marketplace, books,
           captable, crm, referrals, affiliates, authors, licensing, x402,
           marketing, campaign, ads, experiments]

  - id: platform
    title: "Platform"
    role: "the cloud fabric — deploy · provision · route · host"
    # `visor` is the compute plane — machines, GPUs, clusters, the BYO fleet.
    # `zt` is the zero-trust overlay: networks and the mesh. `admission` is the
    # waitlist a flag admits an org through, so it files with flags.
    tags: [platform, deploy, projects, registry, gateway, ingress, domain,
           cloudflare, visor, zt, flags, admission]

  - id: applications
    title: "Applications"
    role: "the user-facing surfaces built on all of the above"
    # `todo` is a list a person keeps — a surface. It is NOT streams' `tasks`,
    # the durable async queue; two words, two things. `bot` is the org's own
    # connected machines; `bots` a bot run on a surface. `link` is short links,
    # answering at /v1/links.
    tags: [git, templates, blueprint, bot, bots, world, todo, framework,
           content, guide, help, meet, share, social, link, esign, dataroom,
           company, legal, prefs, settings, functions, sbom, seo]

  - id: chain
    title: "Chain"
    role: "the networks the cloud speaks to — enumerate · call · read balances"
    # `web3` lists the chains, relays JSON-RPC to one, and reads a holder's
    # balances; `explorer` indexes them and serves oracles. They are not
    # Platform — that is the fabric this cloud RUNS on, and a chain is something
    # it TALKS TO.
    tags: [web3, explorer]
