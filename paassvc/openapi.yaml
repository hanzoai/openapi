openapi: 3.1.0
info:
  title: Hanzo PaaS API
  summary: Native Hanzo PaaS control plane — the fleet drift board and one-way deploy surface (paassvc).
  description: "The native, in-process Hanzo PaaS control plane served by the `paassvc`\nsubsystem of\
    \ the unified cloud binary, reached through the gateway at\n`api.hanzo.ai`. It is the Go port of the\
    \ standalone platform's\nbuild→deploy lifecycle, collapsed into a cloud subsystem that speaks to the\n\
    SAME operator surface the deploy-executor drove: the `hanzo.ai/v1` `services`\nCustomResource.\n\n\
    Two responsibilities:\n  - Observe the fleet drift board: list every operator Service CR across the\n\
    \    platform namespaces, read declared vs running tag + health, and attach the\n    derived drift\
    \ verdict.\n  - Deploy a new image tag by merge-patching the Service CR's `.spec.image`;\n    the\
    \ operator reconciles the rollout. Cloud never reimplements a deployer.\n\nNAMESPACE NOTE — despite\
    \ the subsystem being registered as `paassvc`, its real\nHTTP surface is mounted under `/v1/paas/*`\
    \ (the generic `/v1/paassvc/health`\nliveness probe is deliberately kept separate so the real k8s\
    \ probe can own\n`/v1/paas/health`).\n\nSECURITY — every `/v1/paas/apps*` route is GLOBAL-ADMIN ONLY,\
    \ fail-closed,\ngated on `c.IsAdmin()` (a JWT-validated principal whose org is the admin org).\nThe\
    \ PaaS control plane reads and mutates SYSTEM Service CRs across the whole\nfleet, so a tenant must\
    \ never patch another org's — or a platform — service.\nThe `/v1/paas/health` route is NOT admin-gated\
    \ (liveness must be probe-able\nwithout a JWT).\n\nAuthentication: Bearer JWT issued by Hanzo IAM\
    \ (`https://hanzo.id`). The same\ntoken authenticates every Hanzo service.\n"
  version: 1.0.0
  contact:
    name: Hanzo AI
    url: https://hanzo.ai
    email: support@hanzo.ai
  license:
    name: Proprietary
    url: https://hanzo.ai/terms
servers:
- url: https://api.hanzo.ai
  description: Hanzo Gateway Production
security:
- bearerAuth: []
tags:
- name: Drift Board
  description: Observe the fleet's declared vs running image tags and drift verdict.
- name: Deploy
  description: Roll a new image tag onto a service via Service CR merge-patch.
- name: Health
  description: Real k8s reachability + Service CRD presence probe.
paths:
  /v1/paas/apps:
    get:
      tags:
      - Drift Board
      summary: List the fleet drift board
      description: 'Returns the whole fleet''s drift board — every operator Service CR across

        the scanned platform namespaces (`hanzo`, `hanzo-testnet`, `hanzo-devnet`),

        mapped to an `AppView` with observed declared/running tags, health, phase,

        endpoints, and the derived drift verdict. Ordered deterministically by

        (org, app, env). Global-admin only.

        '
      operationId: listApps
      parameters:
      - name: env
        in: query
        required: false
        description: Narrow to one lifecycle env.
        schema:
          type: string
          enum:
          - main
          - test
          - dev
      - name: health
        in: query
        required: false
        description: Narrow to rows with this health value.
        schema:
          type: string
          enum:
          - green
          - yellow
          - red
      - name: org
        in: query
        required: false
        description: Narrow to one image namespace ("org"), e.g. `hanzoai`.
        schema:
          type: string
      - name: drift
        in: query
        required: false
        description: When `1` or `true`, return only rows that are actually drifting (drift severity ≠
          ok).
        schema:
          type: string
          enum:
          - '1'
          - 'true'
      responses:
        '200':
          description: The drift board plus a per-severity summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  apps:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppView'
                  summary:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: Number of rows after filtering.
                      byDrift:
                        type: object
                        properties:
                          ok:
                            type: integer
                          yellow:
                            type: integer
                          red:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: Bad Gateway — a kubernetes list/RBAC error while reading Service CRs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/paas/apps/{app}:
    get:
      tags:
      - Drift Board
      summary: Get one service row by CR name
      description: 'Returns one service row by Service CR name. Scans the platform namespaces

        in env order (`main` → `test` → `dev`) and returns the first match, so a

        bare app name resolves to production by default. Global-admin only.

        '
      operationId: getApp
      parameters:
      - name: app
        in: path
        required: true
        description: The Service CR name. Must be a DNS-1123 label (`^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$`).
        schema:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
      responses:
        '200':
          description: The observed service row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: Bad Gateway — a kubernetes get/RBAC error while reading the Service CR.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/paas/apps/{app}/deploy:
    post:
      tags:
      - Deploy
      summary: Deploy a new image tag
      description: 'Rolls a new image tag onto a service by merge-patching ONLY the Service

        CR''s `.spec.image`. The operator reconciles the rollout (Deployment

        update, rolling restart). When `repository` is omitted, only the tag +

        pullPolicy are patched, preserving the CR''s existing repository.

        Global-admin only.

        '
      operationId: deployApp
      parameters:
      - name: app
        in: path
        required: true
        description: The Service CR name. Must be a DNS-1123 label.
        schema:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployRequest'
      responses:
        '200':
          description: The patch was accepted; the operator will reconcile the rollout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          description: Bad Gateway — a kubernetes patch/RBAC error while patching the Service CR.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/paas/health:
    get:
      tags:
      - Health
      summary: PaaS control-plane health probe
      description: 'A real probe: verifies the API server is reachable and that the Service

        CRD is served. Returns `200` only when everything is ok; `503` + the real

        reason otherwise. NOT admin-gated — liveness must be probe-able by the

        platform/operator without a JWT.

        '
      operationId: paasHealth
      security: []
      responses:
        '200':
          description: The control plane is healthy — k8s reachable and the Service CRD is served.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                service: paas
                status: ok
                k8s: true
                crd: true
        '503':
          description: 'Degraded — either the kubernetes client is unconfigured (`k8s: false`

            with the init error) or the Service CRD is unreachable (`crd: false`).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                service: paas
                status: degraded
                k8s: false
                error: no in-cluster config and no kubeconfig
components:
  securitySchemes:
    bearerAuth:
      $ref: '#/components/securitySchemes/bearerAuth'
    oauth2:
      type: oauth2
      description: OAuth2 authentication via Hanzo IAM
      flows:
        authorizationCode:
          authorizationUrl: https://iam.hanzo.ai/oauth/authorize
          tokenUrl: https://iam.hanzo.ai/oauth/token
          refreshUrl: https://iam.hanzo.ai/oauth/token
          scopes:
            openid: OpenID Connect identity
            profile: User profile information
            email: Email address
            read: Read access to resources
            write: Write access to resources
            admin: Administrative access
        clientCredentials:
          tokenUrl: https://iam.hanzo.ai/oauth/token
          scopes:
            read: Read access to resources
            write: Write access to resources
            admin: Administrative access
        password:
          tokenUrl: https://iam.hanzo.ai/oauth/token
          scopes:
            openid: OpenID Connect identity
            profile: User profile information
            email: Email address
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'API key for service-to-service authentication.


        Generate keys via the Hanzo Gateway /key/generate endpoint.

        '
  schemas:
    AppView:
      type: object
      description: 'One service row on the drift board: observed tags + topology + the derived

        drift verdict. Fields map directly to the Go `AppView` struct.

        '
      properties:
        id:
          type: string
          description: '`<org>/<app>/<env>`, e.g. `hanzoai/iam/main`.'
        org:
          type: string
          description: Image namespace, e.g. `hanzoai`.
        app:
          type: string
          description: Service / CR name, e.g. `iam`.
        env:
          type: string
          description: Lifecycle env.
          enum:
          - main
          - test
          - dev
        repo:
          type: string
          description: owner/repo GitHub coordinate, e.g. `hanzoai/iam`.
        registry:
          type: string
          description: The full image repository path (registry host + namespace + name).
        declaredTag:
          type: string
          description: Declared image tag from `spec.image.tag` on the Service CR.
        runningTag:
          type: string
          description: Running image tag observed from the live Deployment container. Empty when unknown.
        latestTag:
          type: string
          description: Newest released tag. Currently always empty (GH-release reader is a follow-up phase).
        health:
          type: string
          description: Rolled-up health from the operator-reconciled Service status. Empty when no replica
            signal yet.
          enum:
          - green
          - yellow
          - red
          - ''
        phase:
          type: string
          description: Operator `status.phase` (e.g. `Running`).
        cluster:
          type: string
          description: Cluster name (currently always `hanzo-k8s`).
        namespace:
          type: string
          description: The kubernetes namespace the Service CR lives in.
        endpoints:
          type: array
          items:
            type: string
          description: Endpoints from the operator-reconciled `status.endpoints`.
        drift:
          $ref: '#/components/schemas/Drift'
    Drift:
      type: object
      description: The drift verdict for one observed service row — ordered flags plus the rolled-up severity.
      properties:
        severity:
          $ref: '#/components/schemas/DriftSeverity'
        flags:
          type: array
          description: The drift findings (always present, never null).
          items:
            $ref: '#/components/schemas/DriftFlag'
    DriftFlag:
      type: object
      description: A single drift finding.
      properties:
        kind:
          type: string
          description: The kind of drift.
          enum:
          - stale
          - un-rolled
          - floating-declared
          - floating-running
          - no-release
          - zero-assets
        severity:
          $ref: '#/components/schemas/DriftSeverity'
        message:
          type: string
          description: Human-readable reason for the finding.
    DriftSeverity:
      type: string
      description: Aggregate drift severity. `ok` = no flags; otherwise the max over flags.
      enum:
      - ok
      - yellow
      - red
    DeployRequest:
      type: object
      required:
      - tag
      properties:
        tag:
          type: string
          description: 'Required — the new image tag to deploy (e.g. `v1.1.3`). Must be a

            single image tag: no whitespace or `/`, max 128 chars.

            '
          maxLength: 128
        repository:
          type: string
          description: 'Optional — override the image repository. When omitted, the CR''s

            existing repository is preserved. Must match

            `^[a-z0-9][a-z0-9._/-]*[a-z0-9]$`.

            '
          pattern: ^[a-z0-9][a-z0-9._/-]*[a-z0-9]$
        namespace:
          type: string
          description: 'Optional — target namespace. When omitted, the CR is resolved in env

            order (`main` → `test` → `dev`). Must be a platform namespace.

            '
          enum:
          - hanzo
          - hanzo-testnet
          - hanzo-devnet
    DeployResponse:
      type: object
      properties:
        rolledOut:
          type: boolean
          description: Always `true` on a successful patch.
        target:
          type: string
          description: '`<namespace>/<app>` the patch was applied to.'
        reason:
          type: string
          description: Human-readable summary of the patch, e.g. `patched Service/iam image to v1.1.3`.
        app:
          $ref: '#/components/schemas/AppView'
    Health:
      type: object
      description: The PaaS control-plane health probe result.
      properties:
        service:
          type: string
          enum:
          - paas
        status:
          type: string
          enum:
          - ok
          - degraded
        k8s:
          type: boolean
          description: Whether the kubernetes client is configured and the API server is reachable.
        crd:
          type: boolean
          description: Whether the Service CRD is served (present only once k8s is reachable).
        error:
          type: string
          description: The real failure reason, present only when degraded.
    Error:
      type: object
      required:
      - status
      - msg
      properties:
        status:
          type: string
          enum:
          - error
          description: Always "error" for error responses
        msg:
          type: string
          description: Human-readable error message
        code:
          type: integer
          description: Application-specific error code
        data:
          type: object
          description: Additional error context
        data2:
          type: object
          description: Additional error details
        requestId:
          type: string
          description: Request ID for debugging
    ValidationError:
      type: object
      properties:
        status:
          type: string
          enum:
          - error
        msg:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
              code:
                type: string
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          description: Token lifetime in seconds
        refresh_token:
          type: string
          description: Refresh token for obtaining new access tokens
        scope:
          type: string
          description: Space-separated list of granted scopes
        id_token:
          type: string
          description: OpenID Connect ID token (JWT)
    UserInfo:
      type: object
      description: OIDC UserInfo response
      properties:
        sub:
          type: string
          description: Subject identifier (user ID)
        name:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        preferred_username:
          type: string
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        phone_number:
          type: string
        phone_number_verified:
          type: boolean
        picture:
          type: string
          format: uri
        updated_at:
          type: integer
          description: Unix timestamp
    Web3AuthRequest:
      type: object
      description: Web3 wallet authentication request
      required:
      - address
      - nonce
      - signature
      properties:
        address:
          type: string
          description: Ethereum wallet address
          pattern: ^0x[a-fA-F0-9]{40}$
        nonce:
          type: string
          description: Nonce obtained from /v1/iam/auth/web3-nonce
        createAt:
          type: integer
          description: Timestamp when signature was created
        typedData:
          type: string
          description: The message that was signed
        signature:
          type: string
          description: Wallet signature
        walletType:
          type: string
          description: Type of wallet used
          enum:
          - MetaMask
          - WalletConnect
          - Coinbase
          - Rainbow
  responses:
    BadRequest:
      description: Bad Request - Invalid input parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidParameter:
              value:
                status: error
                msg: 'Invalid parameter: email format is incorrect'
                code: 400
    Unauthorized:
      description: Unauthorized - Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingToken:
              value:
                status: error
                msg: Authentication required
                code: 401
            invalidToken:
              value:
                status: error
                msg: Invalid or expired token
                code: 401
    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            insufficientPermissions:
              value:
                status: error
                msg: You don't have permission to access this resource
                code: 403
    NotFound:
      description: Not Found - Resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            resourceNotFound:
              value:
                status: error
                msg: Resource not found
                code: 404
    Conflict:
      description: Conflict - Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            alreadyExists:
              value:
                status: error
                msg: Resource with this ID already exists
                code: 409
    UnprocessableEntity:
      description: Unprocessable Entity - Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          examples:
            validationFailed:
              value:
                status: error
                msg: Validation failed
                errors:
                - field: email
                  message: Invalid email format
                  code: invalid_format
    TooManyRequests:
      description: Too Many Requests - Rate limit exceeded
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Request limit per window
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests in window
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Unix timestamp when window resets
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retry
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              value:
                status: error
                msg: Rate limit exceeded. Please retry after 60 seconds
                code: 429
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverError:
              value:
                status: error
                msg: An internal error occurred
                code: 500
                requestId: req_abc123
    ServiceUnavailable:
      description: Service Unavailable - Temporary outage
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retry
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            maintenance:
              value:
                status: error
                msg: Service temporarily unavailable
                code: 503
