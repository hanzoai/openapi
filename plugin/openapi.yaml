openapi: 3.1.0
info:
  title: Hanzo Plugin API
  summary: Runtime plugin loader and introspection for the unified cloud binary (hanzoai/cloud).
  description: |
    The plugin subsystem of the unified Hanzo cloud binary. `cloud` is a thin
    host: its native Go subsystems are compiled in, but everything else mounts at
    RUNTIME from a JSON manifest (`CLOUD_PLUGINS`) — no cloud rebuild to add or
    update a service.

    Two plugin kinds, both reduced to "produce an `http.Handler`, then
    `app.Mount(prefix, h)`":
      - `wasm`  — a polyglot service (Rust/WASM, or Python/TS via goa) loaded
                  in-process through `github.com/hanzoai/goa`.
      - `proxy` — a standalone server reached over a pluggable transport
                  (`http` default, or `zap`).

    Because plugins mount at arbitrary manifest-defined prefixes, their routes are
    NOT part of this fixed contract. The static HTTP surface this subsystem
    registers is the introspection endpoint `GET /v1/plugins`, which lists what is
    currently mounted, plus the operator surface under `/v1/admin/plugins` that
    reads each host's running processes and swaps, stops and starts them. If
    `CLOUD_PLUGINS` is unset, zero plugins mount and the list is empty.

    Introspection and operation answer different questions. `GET /v1/plugins`
    reports the MANIFEST view — name, kind, prefix — for the host that answered.
    `/v1/admin/plugins` reports the PROCESS view — pid, uptime, reload and restart
    counts, measured CPU/RSS/thread/fd cost — per host across the fleet, plus the
    drift roll-up that says whether a rollout finished.

    Authentication: Bearer JWT issued by Hanzo IAM (`https://hanzo.id`). The same
    token authenticates every Hanzo service.
  version: 8.0.0
  contact:
    name: Hanzo AI
    url: https://hanzo.ai
    email: support@hanzo.ai
  license:
    name: Proprietary
    url: https://hanzo.ai/terms
servers:
- url: https://api.hanzo.ai
  description: Hanzo Gateway Production
security:
- BearerAuth: []
tags:
- name: Plugins
  description: Runtime plugin introspection.
- name: Admin
  description: Fleet plugin operation — list, enable, disable, reload.
paths:
  /v1/plugins:
    get:
      tags:
      - Plugins
      summary: List mounted plugins
      description: |
        Returns every plugin currently mounted from the runtime manifest, as a
        flat list of `{name, kind, prefix}`. This is introspection only — it does
        not expose the plugins' own routes, which live at each plugin's `prefix`.
        The list is empty when no manifest is configured (`CLOUD_PLUGINS` unset).
      operationId: listPlugins
      responses:
        '200':
          description: The set of mounted plugins.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/plugins:
    get:
      tags:
      - Admin
      summary: List what each host is running
      description: |
        list reports what each host is actually running: every loaded plugin with its
        version, pid, uptime, reload and restart counts, and its measured CPU, RSS,
        thread and fd cost — read from the kernel, which is only answerable at all
        because a plugin is a process.

        Reading this from deployment config would answer what was INTENDED. Only the
        process knows what is TRUE, and during a rolling upgrade the two disagree on
        purpose.
      operationId: adminPlugins
      parameters:
      - name: scope
        in: query
        required: false
        description: |
          Scope "host" answers for THIS host only. Default "fleet" fans out to every
          live peer. A peer answers a host-scoped read, which is what stops the
          fan-out recursing.
        schema:
          type: string
      responses:
        '200':
          description: Per-host plugin inventory plus the fleet drift roll-up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOut'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/plugins/{name}/enable:
    post:
      tags:
      - Admin
      summary: Enable a stopped or disabled plugin
      description: |
        enable brings a stopped or disabled plugin back on the artifact it already
        has: the zero Plugin names no new artifact, so Reload reuses the loaded spec
        and clears the disabled flag. Named for what an operator means by it.
      operationId: adminEnablePlugin
      parameters:
      - $ref: '#/components/parameters/PluginName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameIn'
      responses:
        '200':
          description: Per-host result of the enable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionOut'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/plugins/{name}/disable:
    post:
      tags:
      - Admin
      summary: Disable a plugin — its routes answer 503, not 404
      description: |
        disable stops the plugin. Its routes STAY REGISTERED and answer 503 — not 404.

        That is zip's choice and this keeps it. Removing the routes would mutate the
        route table, and re-adding them on enable would grow it without bound across
        repeated cycles, which is the invariant that makes reloads flat in memory. It
        is also the better answer: 404 says "no such API" and a client may cache it
        and stop retrying, while 503 says "this API exists and is down right now",
        which is true and retryable. Which of the two 503s this is — deliberate stop
        or crash — is what the status's disabled flag reports.
      operationId: adminDisablePlugin
      parameters:
      - $ref: '#/components/parameters/PluginName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameIn'
      responses:
        '200':
          description: Per-host result of the disable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionOut'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/plugins/{name}/reload:
    post:
      tags:
      - Admin
      summary: Reload a plugin onto another build
      description: |
        reload swaps a plugin for another build without dropping a request. The
        replacement is started and proven to be LISTENING before any traffic moves to
        it, so a bad build leaves the old one serving and returns an error rather
        than a hole; the old process then drains before it is killed.

        With a version or url+sum it pins; naming a digest this host has run before is
        the rollback, and costs no network because the digest IS the cache key. With
        neither it restarts what is already loaded.

        Fleet scope applies it to one host at a time and STOPS at the first failure,
        so a build that cannot come up reaches exactly one host.
      operationId: adminReloadPlugin
      parameters:
      - name: name
        in: path
        required: true
        description: Name is the app, from the path. It must be one the manifest declares.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReloadIn'
      responses:
        '200':
          description: Per-host result of the reload, with the digest now running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionOut'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token issued by Hanzo IAM (https://hanzo.id). The same token
        authenticates every Hanzo service.
  parameters:
    PluginName:
      name: name
      in: path
      required: true
      description: Name is the app, from the path.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    PluginList:
      type: object
      description: The set of plugins mounted from the runtime manifest.
      required:
      - plugins
      properties:
        plugins:
          type: array
          items:
            $ref: '#/components/schemas/PluginInfo'
    PluginInfo:
      type: object
      description: |
        Introspection view of one mounted plugin. Derived from the manifest
        `Plugin` entry; only the three public identity fields are surfaced.
      properties:
        name:
          type: string
          description: Plugin name from the manifest entry.
        kind:
          type: string
          description: Plugin kind selecting how it was built and mounted.
          enum:
          - wasm
          - proxy
        prefix:
          type: string
          description: Mount point at which the plugin's routes are served.
          example: /v1/pricing
    ListOut:
      type: object
      description: The fleet board — one entry per host, plus the drift roll-up.
      properties:
        status:
          type: string
        msg:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Host'
        drift:
          type: array
          items:
            $ref: '#/components/schemas/Drift'
        data2:
          type: integer
    Host:
      type: object
      description: |
        One host's own account of what it is running. Reported per host rather than
        merged, because during a rollout the hosts disagree BY DESIGN and a merged
        view hides exactly the state an operator is watching for.
      properties:
        host:
          type: string
          description: |
            Host is the pod's stable id, and Addr where it was reached. Self is true
            for the host that answered the request.
        addr:
          type: string
        self:
          type: boolean
        error:
          type: string
          description: |
            Err is set when a peer could not be reached. Its plugins are then
            unknown, which is NOT the same as none, so the list stays empty and the
            drift below refuses to conclude anything from it.
        plugins:
          type: array
          items:
            $ref: '#/components/schemas/PluginStatus'
    PluginStatus:
      type: object
      description: |
        One plugin's process view on one host — what `GET /v1/plugins` cannot
        answer, because that reports the manifest and this reports the kernel.
      properties:
        name:
          type: string
        prefix:
          type: string
          description: |
            Prefix is the FIRST subtree this plugin answers — the one a log line
            names it by. Prefixes is every subtree, and a plugin may own several.
            Reporting only the first would understate the blast radius of taking
            this plugin down, which is the question a fleet view exists to answer.
        prefixes:
          type: array
          items:
            type: string
        source:
          type: string
          description: |
            Source is where the binary came from: "embedded", "path", "url", or
            "remote" for an instance this host did not start.
          enum:
          - embedded
          - path
          - url
          - remote
        version:
          type: string
          description: |
            Version is the artifact's SHA-256 when it was installed from a URL —
            the only version identifier that cannot drift from the bits actually
            running, since it IS the bits. Empty for the other sources.
        addr:
          type: string
          description: Addr is the socket or address serving it.
        pid:
          type: integer
          description: PID is the child process, or 0 when this host did not start it.
        running:
          type: boolean
          description: |
            Running is false after Unload, or after a child exited and no Reload has
            replaced it. Its routes stay registered and answer 503, so a false here
            is the difference between "not deployed" and "deployed but down".
        disabled:
          type: boolean
          description: |
            Disabled is true when Unload stopped it deliberately, as opposed to it
            having crashed. Both answer 503, so without this an operator cannot tell
            a maintenance window from an outage — and would page for the former.
        since:
          type: string
          format: date-time
          description: |
            Since is when the CURRENT instance started — it resets on Reload, so it
            reports the age of what is running, not of the mount.
        reloads:
          type: integer
          description: |
            Reloads counts successful swaps since Load. A climbing number on one
            host and not its peers is the signal that a rollout is uneven.
        restarts:
          type: integer
          description: |
            Restarts counts times the supervisor brought this plugin back after it
            died on its own. Distinct from Reloads, which are deliberate: a nonzero
            Restarts is a plugin crashing, and a climbing one is a crash loop.
        usage:
          $ref: '#/components/schemas/PluginUsage'
    PluginUsage:
      type: object
      description: |
        A plugin's resource cost, measured rather than self-reported.

        This exists because a plugin is a process. A linked-in subsystem cannot be
        measured this way at any price — one process has one RSS and one CPU clock,
        and nothing inside it can be attributed to a subsystem. Running a service as
        its own process makes "which app is eating the memory" a question with an
        exact answer instead of an argument.

        Zero means not measured (no /proc, or nothing running), not measured-as-zero.
      properties:
        cpuNs:
          type: integer
          format: int64
          description: |
            CPU is total user+system time this instance has consumed since it
            started, in nanoseconds. It only ever climbs, so a rate is the
            interesting derivative.
        rssBytes:
          type: integer
          format: int64
          description: |
            RSS is resident memory in bytes — the honest number for "what does this
            plugin cost", as opposed to virtual size.
        threads:
          type: integer
          description: |
            Threads and FDs are the two limits a busy service hits first, and both
            are leaks when they climb without bound.
        fds:
          type: integer
    Drift:
      type: object
      description: |
        One plugin's agreement across the fleet. Versions holds every distinct
        digest seen running; more than one means a rollout is incomplete or stuck,
        which is the single question this whole view exists to answer.
      properties:
        name:
          type: string
        versions:
          type: array
          items:
            type: string
        running:
          type: integer
        down:
          type: integer
        disabled:
          type: integer
        drifted:
          type: boolean
    ActionOut:
      type: object
      description: |
        The envelope every mutation answers with. Data is per host and in the order
        applied, so a halted rollout reads as the prefix that succeeded followed by
        the one that did not.
      properties:
        status:
          type: string
        msg:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Result'
    Result:
      type: object
      description: One host's outcome for one action.
      properties:
        host:
          type: string
        ok:
          type: boolean
        version:
          type: string
        msg:
          type: string
    NameIn:
      type: object
      description: |
        Addresses one plugin by name, for the operations that take nothing else.
      properties:
        name:
          type: string
          description: Name is the app, from the path.
        scope:
          type: string
          description: |
            Scope "host" applies here only; default "fleet" applies everywhere.
    ReloadIn:
      type: object
      description: |
        Names an artifact to run. Exactly one of Version or URL+Sum, or neither to
        restart the artifact already loaded — which is how a wedged plugin is
        bounced without changing what it runs.
      properties:
        name:
          type: string
          description: |
            Name is the app, from the path. It must be one the manifest declares.
        version:
          type: string
          description: |
            Version is a release tag, resolved to a URL and digest through the
            origin's binaries.json index — the same index CI publishes, so there is
            no second table mapping versions to digests.
        url:
          type: string
          description: |
            URL is the artifact directly, for an origin with no index. Sum is its hex
            SHA-256 and is REQUIRED with it: zip refuses an unverified download, and
            so does this.
        sum:
          type: string
        scope:
          type: string
          description: |
            Scope "host" applies here only. Default "fleet" rolls it out one host at
            a time, halting on the first host that fails to come up.
    Error:
      type: object
      description: Standard error envelope.
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: string
