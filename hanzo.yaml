openapi: 3.1.0
info:
  title: Hanzo Cloud
  version: 1.0.0
  summary: Discovery index for the Hanzo Cloud API surface.
  description: |
    Hanzo Cloud is the unified API surface for the Hanzo AI Platform. Every
    service is reachable through a single gateway at `api.hanzo.ai` with a
    single bearer token issued by Hanzo IAM (`https://hanzo.id`).

    This document is the discovery index. Each service has its own complete
    OpenAPI 3.1 specification under `openapi/<service>/openapi.yaml`. There
    are no cross-file `$ref` links between service specs — each is
    self-contained.

    Authentication: Bearer JWT issued by Hanzo IAM. OIDC discovery is at
    `https://hanzo.id/.well-known/openid-configuration`.

    Routing: every service is exposed at `https://api.hanzo.ai/v1/<service>/*`
    in addition to its own subdomain. Every Hanzo route lives under `/v1/<service>/`.
    No legacy prefixes exist anywhere in the Hanzo HTTP contract.
  contact:
    name: Hanzo AI
    url: https://hanzo.ai
    email: support@hanzo.ai
  license:
    name: Proprietary
    url: https://hanzo.ai/terms
servers:
- url: https://api.hanzo.ai
  description: Hanzo Gateway Production
security:
- BearerAuth: []
tags:
- name: Discovery
  description: Index of Hanzo services and routing.
- name: Health
  description: Liveness checks.
- name: OIDC
  description: OpenID Connect discovery.
paths:
  /v1/discovery:
    get:
      tags:
      - Discovery
      summary: List Hanzo services
      operationId: listServices
      security: []
      responses:
        '200':
          description: List of services with subdomain, gateway route, and spec URL.
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
              example:
                services:
                - name: cloud
                  subdomain: https://api.hanzo.ai
                  gateway_route: /v1/chat/completions
                  spec: https://raw.githubusercontent.com/hanzoai/openapi/main/cloud/openapi.yaml
                - name: iam
                  subdomain: https://hanzo.id
                  gateway_route: /v1/iam
                  spec: https://raw.githubusercontent.com/hanzoai/openapi/main/iam/openapi.yaml
  /v1/health:
    get:
      tags:
      - Health
      summary: Gateway health check
      operationId: gatewayHealth
      security: []
      responses:
        '200':
          description: Gateway is healthy.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  version:
                    type: string
              example:
                status: ok
                version: 1.0.0
  /.well-known/openid-configuration:
    get:
      tags:
      - OIDC
      summary: OIDC discovery (proxied from hanzo.id)
      operationId: oidcDiscovery
      security: []
      responses:
        '200':
          description: OIDC configuration document.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer: { type: string, format: uri }
                  authorization_endpoint: { type: string, format: uri }
                  token_endpoint: { type: string, format: uri }
                  userinfo_endpoint: { type: string, format: uri }
                  jwks_uri: { type: string, format: uri }
              example:
                issuer: https://hanzo.id
                authorization_endpoint: https://hanzo.id/oauth/authorize
                token_endpoint: https://hanzo.id/oauth/token
                userinfo_endpoint: https://hanzo.id/oauth/userinfo
                jwks_uri: https://hanzo.id/.well-known/jwks
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer JWT issued by Hanzo IAM (https://hanzo.id). Discovery:
        https://hanzo.id/.well-known/openid-configuration. Obtain via
        /v1/iam/auth/login, /oauth/token, or the API key UI on hanzo.id.
  schemas:
    Service:
      type: object
      required: [name, subdomain, gateway_route, spec]
      properties:
        name:
          type: string
          description: Service slug.
        subdomain:
          type: string
          format: uri
          description: Service's own canonical hostname.
        gateway_route:
          type: string
          description: Path prefix served through api.hanzo.ai.
        spec:
          type: string
          format: uri
          description: URL of the service's OpenAPI 3.1 spec.
