name: CI/CD

# The ~7-line canonical caller: triggers plus the import. All real config lives
# in the repo-root hanzo.yml, which platform.hanzo.ai reads too.
# Builds + pushes the agent-skills artifact; auto-mirrors to registry.hanzo.ai.
#
# A WORKFLOW DIRECTORY IS NOT A PREFERENCE, IT IS AN ADDRESS THE FORGE READS.
# GitHub collects only `.github/workflows`; git.hanzo.ai (Gitea) collects the
# FIRST of WORKFLOW_DIRS that exists in the pushed commit and ignores the rest
# (modules/actions/workflows.go, listWorkflowsInDirs breaks on the first hit),
# which today is `.hanzo/workflows`. So the caller belongs at whichever path the
# forge this repo LIVES ON reads, and hanzoai/openapi lives on GitHub:
# git.hanzo.ai/hanzoai/openapi is a 404, there is no mirror.
#
# Moving both callers to `.hanzo/workflows` on 2026-07-30 therefore did not give
# this repo one CI path, it gave it NONE — `gh workflow list` returned nothing
# for five days, and neither CI/CD nor `spec sync` ran once. That is how the
# published document went 81 hanzoai/cloud commits stale, took a hand edit, and
# shipped 19 unserved operations to every SDK with no gate saying a word.
#
# The `uses:` path is the same trap one level down: a reusable is resolved
# against the SAME directory allowlist ("uses:" path %q must be under a
# configured workflow directory), so it must name the path the RESOLVING forge
# reads. hanzoai/ci publishes build.yml at BOTH paths from the same tag,
# byte-identical apart from its header, so this is the same pipeline at @v1 —
# addressed the way GitHub can resolve it.
#
# The runner is unchanged because it was already right: hanzoai/ci defaults to
# ["hanzo-build-linux-amd64"], which the git-runners actually advertise.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:


# Not cancellable: hanzo.yml declares `images:`, so a superseded run may already
# have pushed a layer under the tag it was given.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cicd:
    # THE 7-LINE CALLER, UNCHANGED — AND `test:` STILL DOES NOT RUN AT @v1.
    # Not this repo's defect and not fixable here, so nothing is bolted on to
    # work around it: build.yml guards its test step with `inputs.tests`, and
    # git.hanzo.ai substitutes a workflow_call input's declared TYPE ZERO VALUE,
    # which for `type: boolean` is false — every time, whatever the caller says.
    # Measured on this branch: a caller passing a literal `true` was skipped
    # (run 26630), and so was `format('{0}', inputs.tests) != 'false'` (26662,
    # resolved against the fix branch — 23 steps, the count only that branch
    # has), because the value really is the string 'false'. Five of five repos
    # with a cicd run on the forge are green with that step skipped: cloud, ci,
    # openapi, gateway, commerce. The step directly above it in build.yml exists
    # to refuse a build that tested nothing; it is itself the step not running.
    #
    # The repair is one line in hanzoai/ci — `tests` as `type: string`, so the
    # zero value is '' and only the word false skips — on branch
    # `deliver-the-tests-input`, PROVEN by openapi run 26700: `test spec` 18
    # passed in 99.19s, `test served` all 2293 published operations are served.
    # It is a change to a tag every repo in three orgs pins, so it is an owner's
    # promotion to make, not a caller's. When @v1 carries it, this file needs no
    # edit — which is the point of leaving it canonical.
    uses: hanzoai/ci/.github/workflows/build.yml@v1
    secrets: inherit
