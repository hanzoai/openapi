name: Regenerate SDKs
# The ONE way: hanzo.yaml (merge.py) is the single source of truth. On every
# change, validate it is codegen-clean, then regenerate every SDK from it —
# openapi-generator for ALL languages, no Stainless. python/go/js own their
# generation (each repo has scripts/generate.sh + a generate.yml that runs on
# the spec-update dispatch below); cpp/dart generate here as artifacts.
on:
  push:
    branches: [main]
    paths: ['**/openapi.yaml', 'hanzo.yaml', 'merge.py']
  workflow_dispatch:

concurrency:
  group: regen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate spec (merge.py + codegen gate)
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml
      - name: Regenerate + assert deterministic
        run: |
          python3 merge.py
          git diff --exit-code hanzo.yaml || { echo "::error::hanzo.yaml is stale — run merge.py and commit"; exit 1; }
      - name: Codegen gate (unique operationIds, no dangling refs)
        run: |
          python3 - <<'PY'
          import yaml, json, re, collections
          s = yaml.safe_load(open('hanzo.yaml')); p, c = s['paths'], s['components']
          methods = {"get","put","post","delete","options","head","patch","trace"}
          ids = collections.Counter(op['operationId'] for it in p.values() if isinstance(it,dict)
                                    for m,op in it.items() if m in methods and isinstance(op,dict) and 'operationId' in op)
          dup = {k:v for k,v in ids.items() if v>1}
          txt = json.dumps(s); pool = {k:set(c.get(k,{})) for k in ('schemas','responses','parameters')}
          miss = [f"{k}/{n}" for k,n in set(re.findall(r'#/components/(schemas|responses|parameters)/([^"]+)', txt)) if n not in pool[k]]
          # Response objects may only carry OpenAPI-legal fields (catches unquoted
          # commas in flow-style descriptions that split into phantom keys).
          allowed = {'description','headers','content','links','$ref'}
          badresp = [f"{path} {code} {sorted(set(r)-allowed)}"
                     for path,it in p.items() if isinstance(it,dict)
                     for m,op in it.items() if isinstance(op,dict)
                     for code,r in (op.get('responses') or {}).items()
                     if isinstance(r,dict) and set(r)-allowed]
          print(f"paths={len(p)} ops={sum(ids.values())} dupIds={len(dup)} dangling={len(miss)} badResponses={len(badresp)}")
          assert not dup, f"duplicate operationIds: {list(dup)[:5]}"
          assert not miss, f"dangling refs: {miss[:5]}"
          assert not badresp, f"malformed response objects: {badresp[:5]}"
          print("GATE PASS")
          PY
      - name: Agent Skills gate (skills.py determinism + digest + white-label + read-only)
        run: python3 test_skills.py

  dispatch:
    name: Trigger regeneration (python/go/js)
    needs: validate
    runs-on: hanzo-build-linux-amd64
    strategy:
      matrix:
        repo: [python-sdk, go-sdk, js-sdk]
    steps:
      - name: Fire spec-update to hanzoai/${{ matrix.repo }}
        # Each SDK repo's generate.yml regenerates from this hanzo.yaml with
        # openapi-generator and opens a PR. No Stainless, no API key.
        # SDK_DISPATCH_TOKEN: a PAT (or GitHub App token) with `repo` scope on
        # the three SDK repos, synced from KMS.
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SDK_DISPATCH_TOKEN }}
          repository: hanzoai/${{ matrix.repo }}
          event-type: spec-update

  openapi-generator:
    name: Regenerate ${{ matrix.lang }} (openapi-generator)
    needs: validate
    runs-on: hanzo-build-linux-amd64
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lang: cpp,  generator: cpp-restsdk, repo: hanzoai/cpp-sdk,  props: 'packageName=hanzo' }
          - { lang: dart, generator: dart-dio,    repo: hanzoai/dart-sdk, props: 'pubName=hanzo' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Generate ${{ matrix.lang }} client from hanzo.yaml
        run: |
          curl -sSL -o /tmp/openapi-generator-cli.jar \
            https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/7.14.0/openapi-generator-cli-7.14.0.jar
          java -jar /tmp/openapi-generator-cli.jar generate \
            -i hanzo.yaml -g ${{ matrix.generator }} \
            --additional-properties=${{ matrix.props }} \
            -o out/${{ matrix.lang }}
          echo "generated $(find out/${{ matrix.lang }} -type f | wc -l) files for ${{ matrix.lang }}"
      - name: Upload ${{ matrix.lang }} SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hanzo-${{ matrix.lang }}-sdk
          path: out/${{ matrix.lang }}
          if-no-files-found: error
