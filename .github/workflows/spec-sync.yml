# The gate on the artifact, in both directions.
#
# `hanzo.yaml` is OUTPUT — `publish.py` derives it from hanzo-inc/cloud's own
# emitted `openapi.yaml` at the ref `.spec-lock` pins. Two things can be wrong
# with an output, and they need different questions:
#
#   • publish.py --check   the committed artifact is NOT what its own pinned
#                          input projects to. Somebody hand-edited a generated
#                          file, and an edit to THIS one describes a release
#                          nobody shipped — to seven SDKs, the doc site and the
#                          agent-skills catalog at once. HARD failure on every
#                          push and PR.
#   • publish.py --current the pin is behind cloud's main. Nothing is wrong with
#                          the artifact; it describes an older release.
#
# The second is why the trigger is also a clock. The event that makes the pin
# stale happens in hanzo-inc/cloud, so no push-triggered CI here can catch it —
# measured before this workflow existed: the copy lagged cloud's main twice in
# one afternoon, and each time every SDK, doc page and MCP tool generated from it
# described a router that had already moved. It runs ONLY on the clock, because a
# stale pin is not a broken artifact and must not fail a PR that has nothing to
# do with it.
#
# --check only, and NOTHING is committed. A bot pushing a 3 MB regenerated
# document into main is a second writer on the artifact, and the failure mode —
# an unreviewed API change reaching every client — is worse than the staleness it
# would fix. Red build, one command in the log, a person runs it.
#
# THE DOCUMENT IS IN hanzo-inc/cloud, AND THIS WORKFLOW SPENT ITS WHOLE LIFE
# ASKING hanzoai/cloud. That is a different repository — the re-rooted OSS core,
# a short line sharing no ancestor with the product and carrying no
# `openapi.yaml` at all. It is public, so the checkout SUCCEEDED and the failure
# arrived one step later, as publish.py's "no remote of .cloud carries
# openapi.yaml on `main`". The step then threw that away and printed its own
# guess — that hanzo.yaml had been hand-edited — which is why the gate has been
# read as a drift alarm on an artifact that was, and is, byte-exact. A step that
# overwrites a precise diagnosis with a canned one is worse than a step with no
# message, so both are gone: publish.py says what is wrong, and `set -e` fails
# the step.
#
# CREDENTIAL. hanzo-inc/cloud is private, and the per-job token Hanzo Git mints
# reads the run's OWN repository and anything public — nothing else. Measured on
# hanzoai/python-sdk run 91449, which named the right repo and still took
# `curl: (22) ... 404` on the raw read. So this checkout needs HANZO_GIT_TOKEN,
# the one name in this fleet for a credential that reads git.hanzo.ai.
#
# THE ENFORCING GATE IS NOT HERE. It is `served` in hanzo.yml, which refutes
# every published operation against api.hanzo.ai/v1/openapi.json — public, no
# credential, no checkout, no ref to trust — and therefore runs on every build
# in the same lane as everything else. This workflow is the deeper question kept
# where it can be asked when a credential exists, not the one holding the line.
name: spec sync

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Hourly. Cloud deploys many times a day and each one can move the document;
    # a daily check would let a stale artifact ship SDKs for most of a working day.
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: spec-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: linux-amd64
    steps:
      - uses: actions/checkout@v4

      # Said before the checkout, because an empty token makes `actions/checkout`
      # read a private repo anonymously and report "repository not found" — the
      # one wording that sends a reader looking for a deleted repo instead of a
      # missing credential.
      - name: Is the document reachable?
        env:
          HANZO_GIT_TOKEN: ${{ secrets.HANZO_GIT_TOKEN }}
        run: |
          [ -n "${HANZO_GIT_TOKEN:-}" ] || {
            echo "::error::hanzo-inc/cloud is private and the per-job token reads only this repository. HANZO_GIT_TOKEN (contents:read on hanzo-inc/cloud) is the credential; hanzoai/ci's client lane takes it from KMS, and this standalone workflow can only take it as an org secret. TWO HOMES FOR ONE VALUE, which ends when --check moves into hanzo.yml's test: block, where the lane already exports it."
            exit 1
          }

      # publish.py reads a hanzo-inc/cloud CHECKOUT rather than a release
      # artifact, because the document it wants is the one cloud's own drift gate
      # just proved equal to its router. fetch-depth 0: the pin is a commit
      # behind main, and a shallow clone does not have it.
      - name: Check out hanzo-inc/cloud
        uses: actions/checkout@v4
        with:
          repository: hanzo-inc/cloud
          path: .cloud
          fetch-depth: 0
          token: ${{ secrets.HANZO_GIT_TOKEN }}

      - name: Is hanzo.yaml what its own input projects to?
        run: |
          # --break-system-packages: the runner image ships a PEP 668
          # "externally managed" interpreter, so a bare pip install exits 1.
          # Under `bash -e` that killed the step BEFORE the gate below ever ran,
          # and the log still showed the gate's error text — so this read as
          # "the spec is stale" when the check had not executed at all. Safe
          # here: the container is discarded after the job.
          python3 -m pip install --quiet --break-system-packages pyyaml
          python3 publish.py --check --cloud .cloud

      # Red here means the pin is behind, NOT that main is where it should go.
      # Cloud's main runs ahead of what is deployed — measured at 108 commits and
      # 60 operations api.hanzo.ai does not answer for — and publishing those
      # would fail `served` and ship 60 dead endpoints to every SDK, doc page and
      # agent skill. The pin belongs at the newest release the deployment fully
      # answers for, which `--served` is the test of.
      - name: Is the pin still cloud's main?
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python3 -m pip install --quiet --break-system-packages pyyaml
          python3 publish.py --current --cloud .cloud
