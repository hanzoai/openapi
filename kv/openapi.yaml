openapi: 3.1.0
info:
  title: Hanzo KV API
  description: 'Hanzo KV provides a managed key-value store with caching, pub/sub messaging,

    and stream processing.


    Features:

    - Multi-tenant namespace isolation

    - REST API over the wire protocol

    - Managed clusters with automatic failover

    - Per-key TTL and eviction policies

    - Pub/sub channels with WebSocket support

    - Append-only streams for event sourcing

    '
  version: 8.0.0
  contact:
    name: Hanzo AI
    url: https://hanzo.ai
    email: support@hanzo.ai
  license:
    name: Proprietary
servers:
- url: https://kv.hanzo.ai
  description: KV Production
- url: https://api.hanzo.ai
  description: Hanzo Gateway (via api.hanzo.ai/v1/kv/*)
tags:
- name: Keys
  description: Key-value CRUD operations
- name: Namespaces
  description: Namespace (tenant) management
- name: Clusters
  description: Managed KV cluster lifecycle
- name: kv
security:
- BearerAuth: []
components:
  parameters:
    Name:
      name: name
      in: path
      required: true
      description: |
        The user-supplied resource name (slug). Lowercased and trimmed server-side;
        must match `^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$`.
      schema:
        type: string
        pattern: '^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$'
  requestBodies:
    CreateResource:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateRequest'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: HANZO_API_KEY
      description: Hanzo API Key (Bearer sk-...)
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Bearer JWT issued by Hanzo IAM (https://hanzo.id). Discovery: https://hanzo.id/.well-known/openid-configuration.
        Obtain via /v1/iam/auth/login, /oauth/token, or the API key UI on hanzo.id.'
  schemas:
    CreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$'
          description: Resource name (lowercased/trimmed server-side).
          example: analytics
    CreateResponse:
      type: object
      description: |
        Returned on 201. `password` and `username` are present only for secretful
        kinds (sql, kv, and the dedicated datastore/docdb admin credential). The
        password is returned ONCE and is never retrievable again.
      required: [id, kind, name, status, host, port, database, connectionString]
      properties:
        id:
          type: string
          description: Server-generated resource id.
        kind:
          type: string
          enum: [sql, vector, datastore, kv, search, s3, docdb]
        name:
          type: string
        status:
          type: string
          description: Resource status (e.g. "ready", or "provisioning" for a dedicated instance still coming up).
          example: ready
        host:
          type: string
          description: Customer-facing host (public gateway host, or dedicated instance service).
        port:
          type: integer
        username:
          type: string
          description: Present only for secretful kinds.
        database:
          type: string
        connectionString:
          type: string
          description: Public, routable DSN (internal admin host is remapped out).
        password:
          type: string
          description: Present only for secretful kinds; returned ONCE.
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: integer
    GetResponse:
      type: object
      required: [id, name, kind, status, host, port, database]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [sql, vector, datastore, kv, search, s3, docdb]
        status:
          type: string
          example: ready
        host:
          type: string
        port:
          type: integer
        username:
          type: string
          description: Present only for secretful kinds.
        database:
          type: string
    KeyValue:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
        type:
          type: string
          enum:
          - string
          - hash
          - list
          - set
          - zset
          - stream
        ttl:
          type: integer
          description: Time-to-live in seconds (-1 for no expiry)
        size:
          type: integer
          description: Size in bytes
    ListItem:
      type: object
      required: [id, name, kind, status, host, port, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [sql, vector, datastore, kv, search, s3, docdb]
        status:
          type: string
          example: ready
        host:
          type: string
        port:
          type: integer
        createdAt:
          type: integer
          format: int64
          description: Unix seconds.
    Namespace:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        max_memory_mb:
          type: integer
          description: Memory limit in MB
        used_memory_mb:
          type: number
        key_count:
          type: integer
        eviction_policy:
          type: string
          enum:
          - noeviction
          - allkeys-lru
          - allkeys-lfu
          - volatile-lru
          - volatile-lfu
          - allkeys-random
          - volatile-random
          - volatile-ttl
        created_at:
          type: string
          format: date-time
    Cluster:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum:
          - provisioning
          - running
          - degraded
          - stopped
          - deleted
        version:
          type: string
          description: Server version
        mode:
          type: string
          enum:
          - standalone
          - sentinel
          - cluster
        nodes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              role:
                type: string
                enum:
                - primary
                - replica
              host:
                type: string
              port:
                type: integer
              status:
                type: string
                enum:
                - online
                - offline
                - syncing
              memory_used_mb:
                type: number
              memory_max_mb:
                type: integer
        replicas:
          type: integer
        max_memory_mb:
          type: integer
        connection_uri:
          type: string
          description: Connection string (valkey://...)
        tls:
          type: boolean
        created_at:
          type: string
          format: date-time
    ClusterCreate:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        mode:
          type: string
          enum:
          - standalone
          - sentinel
          - cluster
          default: standalone
        version:
          type: string
          default: '8.0'
        max_memory_mb:
          type: integer
          default: 256
        replicas:
          type: integer
          default: 0
        tls:
          type: boolean
          default: true
        eviction_policy:
          type: string
          enum:
          - noeviction
          - allkeys-lru
          - allkeys-lfu
          - volatile-lru
          - volatile-lfu
          - allkeys-random
          default: allkeys-lru
    StreamEntry:
      type: object
      properties:
        id:
          type: string
          description: Stream entry ID (timestamp-sequence)
        fields:
          type: object
          additionalProperties:
            type: string
    PubSubMessage:
      type: object
      properties:
        channel:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
  responses:
    BadGateway:
      description: The backend provisioner or dedicated-instance operation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: A resource with this name (or physical name) already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Created:
      description: Resource provisioned. Password (if any) is returned ONCE here.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateResponse'
    Deleted:
      description: Resource deprovisioned. No content.
    Forbidden:
      description: No validated principal, or empty org without admin claim.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaymentRequired:
      description: Org balance gate failed (unfunded org).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Resource:
      description: Resource metadata (never a password).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GetResponse'
    ResourceList:
      description: The caller's org resources of this kind (never a password).
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ListItem'
    ServiceUnavailable:
      description: |
        Kind is honestly gated (cannot grant a per-tenant-safe credential), or the
        cluster orchestrator is unavailable for a dedicated kind, or commerce is
        unreachable in the fail-closed posture.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Key not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
paths:
  /v1/kv:
    post:
      tags: [kv]
      operationId: createKv
      summary: Provision a key-value resource
      requestBody:
        $ref: '#/components/requestBodies/CreateResource'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      tags: [kv]
      operationId: listKv
      summary: List key-value resources for the caller's org
      responses:
        '200': { $ref: '#/components/responses/ResourceList' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/kv/clusters:
    get:
      tags:
      - Clusters
      summary: List KV clusters
      operationId: listClusters
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - provisioning
          - running
          - degraded
          - stopped
      responses:
        '200':
          description: List of clusters
          content:
            application/json:
              schema:
                type: object
                properties:
                  clusters:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cluster'
                  total:
                    type: integer
    post:
      tags:
      - Clusters
      summary: Create KV cluster
      operationId: createCluster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterCreate'
      responses:
        '201':
          description: Cluster created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/kv/namespaces:
    get:
      tags:
      - Namespaces
      summary: List namespaces
      operationId: listNamespaces
      responses:
        '200':
          description: List of namespaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Namespace'
    post:
      tags:
      - Namespaces
      summary: Create namespace
      operationId: createNamespace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                max_memory_mb:
                  type: integer
                  default: 64
                eviction_policy:
                  type: string
                  default: allkeys-lru
      responses:
        '201':
          description: Namespace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Namespace'
  /v1/kv/keys:
    get:
      tags:
      - Keys
      summary: Scan keys
      operationId: scanKeys
      parameters:
      - name: pattern
        in: query
        schema:
          type: string
          default: '*'
        description: Glob-style pattern (e.g. user:*, session:*)
      - name: type
        in: query
        schema:
          type: string
          enum:
          - string
          - hash
          - list
          - set
          - zset
          - stream
      - name: cursor
        in: query
        schema:
          type: string
          default: '0'
      - name: count
        in: query
        schema:
          type: integer
          default: 100
      - name: namespace
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Key scan results
          content:
            application/json:
              schema:
                type: object
                properties:
                  cursor:
                    type: string
                    description: Next cursor (0 when scan complete)
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/KeyValue'
  /v1/kv/batch:
    post:
      tags:
      - Keys
      summary: Batch get/set/delete
      operationId: batchOperation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                namespace:
                  type: string
                operations:
                  type: array
                  items:
                    type: object
                    required:
                    - op
                    - key
                    properties:
                      op:
                        type: string
                        enum:
                        - get
                        - set
                        - delete
                      key:
                        type: string
                      value:
                        type: string
                      ttl:
                        type: integer
      responses:
        '200':
          description: Batch results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        value:
                          type: string
                        ok:
                          type: boolean
  /v1/kv/{name}:
    parameters:
    - $ref: '#/components/parameters/Name'
    get:
      tags: [kv]
      operationId: getKv
      summary: Get one key-value resource
      responses:
        '200': { $ref: '#/components/responses/Resource' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [kv]
      operationId: deleteKv
      summary: Deprovision a key-value resource
      responses:
        '204': { $ref: '#/components/responses/Deleted' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
