          application/json:
            schema:
              $ref: '#/components/schemas/setEnvReq'
      responses:
        2XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/appView'
          description: Success
      tags:
      - platform
  /v1/platform/projects/{project}/apps/{app}/preview:
    post:
      operationId: post_v1_platform_projects_by_project_apps_by_app_preview
      parameters:
