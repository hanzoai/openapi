          type: string
      tags:
      - platform
  /v1/platform/projects/{project}/apps/{app}/domains:
    get:
      operationId: get_v1_platform_projects_by_project_apps_by_app_domains
      parameters:
      - in: path
        name: project
        required: true
        schema:
          type: string
      - in: path
        name: app
