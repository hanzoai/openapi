# The /v1/platform surface, authored from what cloud actually serves.
#
# This file used to carry 131 RPC-style /v1/platform/application/*, /v1/platform/
# project/* paths that 404 in production, and NONE of the 33 REST routes cloud
# mounts. That combination is worse than an empty spec: genspec iterates the
# AUTHORED master and the live route table can only REFUTE, never add, so the
# real routes reached no SDK and no `hanzo` command while the dead ones reached
# every one of them.
#
# The 33 are now authored and the dead 131 are gone. Source of truth is cloud's
# openapi.yaml, a golden projection of the live fiber table (byte-identical to it
# under TestFleetIsTheWeaveOfItsApps), so regenerating from cloud is how this
# stays true rather than drifting again.
openapi: 3.1.0
info:
  title: Hanzo Platform API
  description: 'The /v1/platform control plane served by hanzoai/cloud''s platform app: the fleet drift
    board (/v1/platform/fleet), projects and their apps, and sites.


    Authored from cloud''s openapi.yaml, which is a golden projection of the live route table. Every path
    here is served; nothing here is aspirational.

    '
  version: 8.0.0
  contact:
    name: Hanzo AI
    url: https://hanzo.ai
    email: support@hanzo.ai
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://platform.hanzo.ai
  description: Platform Production
- url: https://api.hanzo.ai
  description: Hanzo Gateway (via api.hanzo.ai/v1/platform/*)
security:
- BearerAuth: []
tags:
- name: platform
  description: Fleet drift board, projects/apps, and sites.
paths:
  /v1/platform/fleet:
    get:
      operationId: get_v1_platform_fleet
      tags:
      - platform
      parameters:
      - in: query
        name: env
        required: false
        description: Only rows in this environment (namespace).
        schema:
          type: string
      - in: query
        name: health
        required: false
        description: 'Only rows at this health: green | yellow | red.'
        schema:
          type: string
      - in: query
        name: drift
        required: false
        description: 1 or true — only rows whose live state differs from declared.
        schema:
          type: string
  /v1/platform/fleet/{app}:
    get:
      operationId: get_v1_platform_fleet_by_app
      parameters:
      - in: path
        name: app
        required: true
        schema:
          type: string
      tags:
      - platform
  /v1/platform/fleet/{app}/deploy:
    post:
      operationId: post_v1_platform_fleet_by_app_deploy
      parameters:
      - in: path
        name: app
        required: true
        schema:
          type: string
      - in: query
        name: env
        required: false
        description: Environment (namespace) holding the Deployment to restart.
        schema:
          type: string
      tags:
      - platform
  /v1/platform/health:
    get:
      operationId: get_v1_platform_health
      tags:
      - platform
  /v1/platform/projects:
    get:
      operationId: get_v1_platform_projects
      responses:
        2XX:
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/projectView'
                type: array
          description: Success
      tags:
      - platform
  /v1/platform/projects/{project}:
    get:
      operationId: get_v1_platform_projects_by_project
      parameters:
      - in: path
        name: project
        required: true
        schema:
          type: string
      responses:
        2XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/projectView'
          description: Success
      tags:
      - platform
  /v1/platform/projects/{project}/apps:
    get:
      operationId: get_v1_platform_projects_by_project_apps
      parameters:
      - in: path
        name: project
        required: true
        schema:
          type: string
      responses:
        2XX:
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/appView'
                type: array
          description: Success
      tags:
      - platform
    post:
      operationId: post_v1_platform_projects_by_project_apps
      parameters:
      - in: path
        name: project
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createAppReq'
      responses:
        2XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/appView'
          description: Success
      tags:
      - platform
  /v1/platform/projects/{project}/apps/{app}:
    delete:
      operationId: delete_v1_platform_projects_by_project_apps_by_app
      parameters:
      - in: path
        name: project
        required: true
        schema:
          type: string
      - in: path
        name: app
        required: true
        schema:
          type: string
      tags:
      - platform
    get:
      operationId: get_v1_platform_projects_by_project_apps_by_app
      parameters:
      - in: path
        name: project
        required: true
        schema:
          type: string
      - in: path
        name: app
        required: true
        schema:
          type: string
      responses:
        2XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/appView'
          description: Success
      tags:
