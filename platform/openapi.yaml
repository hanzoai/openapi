components:
  schemas:
    EnvVarJSON:
      properties:
        key:
          type: string
        secret:
          type: boolean
        value:
          type: string
      type: object
    appView:
      properties:
        buildType:
          type: string
        createdAt:
          type: integer
        currentDeploymentId:
          type: string
        description:
          type: string
        dockerfile:
          type: string
        domains:
          items:
            type: string
          type: array
        env:
          items:
            $ref: '#/components/schemas/EnvVarJSON'
          type: array
        environment:
          type: string
        health:
          type: string
        id:
          type: string
        image:
          $ref: '#/components/schemas/imageView'
        name:
          type: string
        namespace:
          type: string
        org:
          type: string
        phase:
          type: string
        port:
          type: integer
        projectId:
          type: string
        replicas:
          type: integer
        repo:
          $ref: '#/components/schemas/gitSource'
        secretSync:
          type: string
        secretSyncDetail:
          type: string
        slug:
          type: string
        source:
          type: string
        status:
          type: string
        storageGb:
          type: integer
        updatedAt:
          type: integer
      type: object
    createAppReq:
      properties:
        buildType:
          type: string
        description:
          type: string
        dockerfile:
          type: string
        domains:
          items:
            type: string
          type: array
        env:
          items:
            $ref: '#/components/schemas/EnvVarJSON'
          type: array
        environment:
          type: string
        image:
          properties:
            repository:
              type: string
            tag:
              type: string
          type: object
        name:
          type: string
        port:
          type: integer
        replicas:
          type: integer
        repo:
          properties:
            branch:
              type: string
            url:
              type: string
          type: object
        slug:
          type: string
        source:
          type: string
        storageGb:
          type: integer
      type: object
    gitSource:
      properties:
        branch:
          type: string
        provider:
          type: string
        url:
          type: string
      type: object
    imageView:
      properties:
        repository:
          type: string
        tag:
          type: string
      type: object
    projectView:
      properties:
        applications:
          type: integer
        createdAt:
          type: integer
        description:
          type: string
        name:
          type: string
        org:
          type: string
        slug:
          type: string
      type: object
    setEnvReq:
      properties:
        env:
          items:
            $ref: '#/components/schemas/EnvVarJSON'
          type: array
      type: object
