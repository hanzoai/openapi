# The canonical example flows — data only, like sdks.yaml beside it.
#
# Every Hanzo SDK ships the SAME six examples under `examples/<flow>/`, in this
# order, under these names. A reader who knows one language's set can then find
# their way around another's without re-learning what the repo chose to
# demonstrate. This file is what makes "the same six" a fact rather than six
# repos independently remembering to agree.
#
# `operations` are operationIds in hanzo.yaml, in call order. That is the part a
# language cannot fudge: test_flows.py asserts every id here exists in the
# merged spec, so deleting or renaming a route upstream breaks THIS gate — one
# place — instead of breaking six SDKs quietly and separately.
#
# Existing in the spec is necessary and not sufficient: an id can resolve and
# still 404 on the wire. Every flow below was PROBED at api.hanzo.ai, and where
# the obvious route did not answer, `notes` says what answered instead and how
# the dead one failed.
#
# THE TEST, in two halves, because each half alone has been wrong here once:
#
#   • 403 PROVES THE ROUTE EXISTS. Auth middleware runs before the handler, so a
#     mounted route refuses (401/403) and an unmounted one is 404/405. That is
#     the only reliable liveness signal — a 404 BODY proves nothing, since a
#     live handler says "not found" too.
#   • PROBE THE METHOD THE DOCUMENT DECLARES, not GET. A POST-only route also
#     404s on GET: POST /v1/mcp answers 200 with 796 tools while GET /v1/mcp is
#     404, and reading that 404 as absence is how the fleet's one MCP door
#     stayed undeclared. One verb is never a liveness probe.
#
# And a 200 is not proof either — see `hello`: /v1/ai/account answers 200 with
# type="anonymous-user" to a request carrying no key at all.
#
# Nothing here is executable and no SDK repo duplicates it. What each example
# prints is the language's business; WHICH routes it calls is not.
#
# Rules an example must hold to, in every language:
#   • read the key from HANZO_API_KEY;
#   • default to https://api.hanzo.ai, overridable by HANZO_BASE_URL;
#   • resolve both in ONE shared place per repo, not once per flow;
#   • be compiled or imported by that repo's CI gate, so it cannot rot.

flows:
  hello:
    summary: Identity — prove the key works and print who it belongs to.
    # The route must FAIL on a bad key, which is the whole point of the flow, so
    # this choice was made by probing api.hanzo.ai rather than by reading a
    # spec. ai_getAccount reads like the obvious pick and is disqualified: it
    # answers 200 with type="anonymous-user" to a request with NO Authorization
    # header, so a `hello` built on it prints a cheerful identity for a key that
    # would 401 everywhere else. Also not the IAM OIDC userinfo endpoint, which
    # is on a different ORIGIN and also answers 200 unauthenticated.
    #
    # WAS bot_authMe (GET /v1/bot/auth/me). That operation exists only in this
    # repo's hand-merged master, not in the document the SDKs now project, and
    # it cannot be shown to exist at all: /v1/bot answers 403 to every path
    # under it, real or invented, so the probe that "verified" it could not tell
    # it from a nonsense sibling. The canonical hello is IAM's, which is where
    # identity lives by law.
    operations: [get_v1_iam_whoami]
    notes: >-
      GET /v1/iam/whoami. An SDK's hello must be the call that says no on a bad
      key. Print the caller's org and subject.

  chat:
    summary: One completion.
    operations: [post_v1_chat_completions]
    notes: >-
      POST /v1/chat/completions, the gateway's own inference route. Non-streaming
      on purpose — streaming is a different transport (SSE) that the generated
      clients return as an opaque body, so demonstrating it here would teach the
      wrong shape. Print choices[0].message.content.

  money:
    summary: Balance, then the usage that moved it.
    operations: [get_v1_billing_balance, get_v1_billing_usage]
    notes: >-
      Neither takes an org: both derive the tenant server-side from the JWT
      `owner` claim, so a key can only read its own money. Both ids are cloud's
      now — /v1/billing is among the routes where the binary's own woven document
      replaced a hand-written spec, so the prose is the handler's.


      An example CAN ask for a window again: /v1/billing/usage takes `start` and
      `end`. It briefly did not — the merge was replacing the whole authored
      operation with cloud's undescribed one, and this note said to stop asking.
      Both are restored, along with the response schema, so an SDK reads a typed
      body rather than decoding by hand. See LLM.md, "An empty field from the
      winner must not delete a populated one".

  store:
    summary: KV round-trip — create a store, read it back, delete it.
    operations: [post_v1_kv, get_v1_kv_name, delete_v1_kv_name]
    notes: >-
      The delete belongs in the language's finally/defer, so a failed read still
      cleans up instead of leaving the store for the next run to collide with.
      This is the provisioning plane, and it is here because it is the one that
      answers. The value plane (/v1/kv/keys/{key} — kv_setKey, kv_getKey,
      kv_deleteKey) is authored in kv/openapi.yaml and is mounted nowhere.


      The discriminator, since a 404 body alone proves nothing: auth middleware
      runs BEFORE the handler, so a route that EXISTS refuses with 403 and a
      route that does not is 404/405. /v1/kv, /v1/kv/demo, /v1/kv/keys and the
      control /v1/agents/{ref} all answer 403 "X-Org-Id required";
      /v1/kv/keys/x answers 404. The parent collection routes and the child
      does not — which is the shape of a plane that was authored and never
      mounted, not of a key that is merely absent.

  agent:
    summary: Create an agent, run it, read the run back.
    operations:
      - post_v1_agents
      - post_v1_agents_by_ref_run
      - get_v1_agents_ref_runs
    notes: >-
      `ref` accepts the public id (agent_...) OR the org-unique name, which is
      why run and read can both use the name just created without waiting for an
      id. Names are org-unique, so an example must not hardcode one. The last
      step is the RUN list, not the agent read: a run is asynchronous, so the
      example polls it until the run it started is terminal.

  tools:
    summary: List the MCP tools this key can reach.
    operations: [get_v1_tools]
    notes: >-
      GET /v1/tools, the tool catalogue this key can reach. List it and print
      three names.
      WAS mcp_rpc (POST /v1/mcp), and that is the flow this one is standing in
      for. The JSON-RPC door is REAL — it answers 202 unauthenticated where a
      nonsense sibling 404s — but hanzoai/cloud's emitted document does not
      describe it, and this file may only name operations the document has. It
      was declared in this repo's hand-merged master; being declared there was
      never evidence that a client could reach it, because no client generates
      from that file any more. The moment cloud projects POST /v1/mcp, this flow
      goes back to tools/list.
      JSON-RPC reports failure INSIDE a 200, so an example reads `error` before
      `result` and `result.isError` before `result.content`. The same operation
      with method=tools/call runs one. `cloud_get_v1_tools` is the REST view of
      the same catalogue and stays available; the door is what an MCP client
      speaks. The automations door (/v1/automations/mcp — automations_mcp) is
      retired: it replies 405 to POST, the method it documents.
