components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Bearer JWT issued by Hanzo IAM (https://hanzo.id). Discovery: https://hanzo.id/.well-known/openid-configuration.'
  responses:
    Unauthorized:
      description: Authentication or authorization failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
          example:
            status: error
            msg: Unauthorized operation
            data: null
            data2: null
  schemas:
    Response:
      type: object
      description: Standard response envelope returned by every endpoint.
      properties:
        status:
          type: string
          enum: [ok, error]
          description: Request outcome.
        msg:
          type: string
          description: Human-readable message; empty on success, error detail on failure.
        data:
          description: Primary payload; shape depends on the endpoint. Null when not applicable.
        data2:
          description: Secondary payload, often a pagination total count. Null when not applicable.
    LaunchRequest:
      type: object
      description: Machine launch or quote request; additional provider-specific spec fields are accepted.
      required:
      - size
      - region
      properties:
        size:
          type: string
          description: Machine size slug (see /v1/sizes and /v1/gpus).
        region:
          type: string
          description: Target region slug (see /v1/regions).
        dryRun:
          type: boolean
          description: When true, returns a LaunchQuote (price estimate) without provisioning or spending.
      additionalProperties: true
