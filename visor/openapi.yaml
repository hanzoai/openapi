openapi: 3.1.0
info:
  title: Hanzo Visor
  description: 'Hanzo Visor is the Hanzo compute control plane.


    It provisions and manages cloud machines (CPU and GPU), block-storage volumes,
    Kubernetes node pools, remote-access assets and desktop sessions, infrastructure
    providers (including BYOC), billing plans, and audit records.


    Two surfaces coexist under the `/v1` namespace:

    - A resource-style REST surface for the public machine catalog and machine
    lifecycle (`/v1/regions`, `/v1/sizes`, `/v1/gpus`, `/v1/machines`, ...).

    - The verb-style control-plane surface (`/v1/<verb>-<resource>`) used by the
    console.


    Every response is wrapped in a standard envelope with `status`, `msg`, `data`,
    and `data2` fields.

    '
  version: 1.0.0
  contact:
    name: Hanzo AI
    url: https://hanzo.ai
    email: support@hanzo.ai
  license:
    name: Proprietary
servers:
- url: https://vm.hanzo.ai
  description: Hanzo Visor Production
security:
- BearerAuth: []
tags:
- name: Compute
  description: Public compute catalog (regions, sizes, GPUs) with Hanzo resale pricing
- name: Machines
  description: Cloud machine catalog and lifecycle
- name: Plans
  description: Billing and capacity plans
- name: Providers
  description: Infrastructure providers, including bring-your-own-cloud (BYOC)
- name: Volumes
  description: Block-storage volume lifecycle
- name: NodePools
  description: Kubernetes node pool management
- name: Sessions
  description: Remote desktop and shell sessions
- name: Assets
  description: Remote-access assets and tunnels
- name: Records
  description: Audit records
- name: Account
  description: Authentication and account
paths:
