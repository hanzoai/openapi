openapi: 3.1.0
info:
  title: Hanzo Referrals API
  summary: Per-org viral-loop referral program that grants promo cloud credit (hanzoai/cloud clients/referrals).
  description: "The Hanzo Cloud referrals surface served by the `referrals` subsystem of the\nunified cloud binary (HIP-0106),\
    \ reached through the gateway at `api.hanzo.ai`.\n\nA native-Go, per-org referral program on Base/SQLite that grants promo\
    \ cloud\ncredit through the same commerce ledger path as an admin comp (the trial/Credit\nbucket, tag `grant:referral`).\n\
    \nThe loop, end to end:\n  1. Every org has a STABLE referral code and a link `https://<brand>/?ref=<code>`.\n  2. A new\
    \ org signs up via a link, the console posts `POST /v1/referrals/claim`\n     with the code, recording referrer to referee\
    \ at status `signed_up`.\n     Self-referral is blocked; one referral per referee ever (idempotent).\n  3. When the referee\
    \ QUALIFIES (has made metered spend) both sides are granted\n     trial credit: referrer +$10 (1000 cents), referee +$5\
    \ (500 cents). The\n     grant is latched at-most-once. The qualify check runs lazily when the\n     referrer loads `GET\
    \ /v1/referrals` and via the admin sweep.\n\nAuthentication: Bearer JWT issued by Hanzo IAM (`https://hanzo.id`). The\
    \ same\ntoken authenticates every Hanzo service. The customer routes are scoped to the\ncaller's org server-side; the\
    \ `/v1/admin/referrals*` routes require global-admin.\n"
  version: 8.0.0
  contact:
    name: Hanzo AI
    url: https://hanzo.ai
    email: support@hanzo.ai
  license:
    name: Proprietary
    url: https://hanzo.ai/terms
servers:
- url: https://api.hanzo.ai
  description: Hanzo Gateway Production
security:
- bearerAuth: []
tags:
- name: Referrals
  description: Customer-facing referral surface, scoped to the caller's org.
- name: Health
  description: Liveness probe.
paths:
  /v1/referrals:
    get:
      operationId: getMyReferrals
      tags:
      - Referrals
      summary: Get my referral code, link, and referrals
      description: 'Returns the caller org''s stable referral code and link, the referrals they

        have made (with per-referral status and credit earned), a status tally, and

        the total credit earned. Opportunistically runs the qualify check for the

        caller''s own pending referees, so the page is self-updating.

        '
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The caller's referral overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyReferralsResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/referrals/claim:
    post:
      operationId: claimReferral
      tags:
      - Referrals
      summary: Claim a referral from a ?ref code
      description: 'Records a referral. The REFEREE is the validated caller (never client-

        supplied); the referrer is resolved from the code. Idempotent (one per

        referee, first-touch wins); self-referral is blocked; an unknown code is

        rejected. Returns 201 when a new referral was created, 200 when it already

        existed.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        '200':
          description: Referral already existed (idempotent replay).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '201':
          description: Referral created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/referrals/health:
    get:
      operationId: referralsHealth
      tags:
      - Health
      summary: Liveness probe
      description: 'Auto-registered liveness probe (serve.go registers `GET /v1/referrals/health`

        for every mounted subsystem). Response body is not defined by this package.

        '
      security: []
      responses:
        '200':
          description: The service is live.
components:
  securitySchemes:
    bearerAuth:
      $ref: ../shared/auth.yaml#/components/securitySchemes/bearerAuth
  schemas:
    ReferralStatus:
      type: string
      description: 'A referral advances signed_up -> qualified -> credited. It never moves

        backward; credited is terminal.

        '
      enum:
      - signed_up
      - qualified
      - credited
    MyReferralView:
      type: object
      description: One row in the referrer's own list (their side of the edge).
      properties:
        id:
          type: string
        referee:
          type: string
          description: The org that signed up via my code.
        status:
          $ref: '#/components/schemas/ReferralStatus'
        creditsCents:
          type: integer
          format: int64
          description: What I earned from this referral, in USD minor units (cents).
        createdAt:
          type: integer
          format: int64
          description: Unix timestamp.
        qualifiedAt:
          type: integer
          format: int64
          description: Unix timestamp; 0 if not yet qualified.
        creditedAt:
          type: integer
          format: int64
          description: Unix timestamp; 0 if not yet credited.
    StatusCounts:
      type: object
      description: The customer-view tally of a referrer's referrals by status.
      properties:
        total:
          type: integer
        signedUp:
          type: integer
        qualified:
          type: integer
        credited:
          type: integer
    MyReferralsResponse:
      type: object
      properties:
        code:
          type: string
          description: The caller org's stable referral code.
        link:
          type: string
          format: uri
          description: The share link, `<linkBase>/?ref=<code>`.
        referrerBonusCents:
          type: integer
          format: int64
          description: Bonus granted to the referrer on qualification (1000 = $10).
        refereeBonusCents:
          type: integer
          format: int64
          description: Bonus granted to the referee on qualification (500 = $5).
        creditsEarnedCents:
          type: integer
          format: int64
          description: Total credit earned across all of the caller's referrals.
        counts:
          $ref: '#/components/schemas/StatusCounts'
        referrals:
          type: array
          items:
            $ref: '#/components/schemas/MyReferralView'
    ClaimRequest:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          description: The referrer's code the referee arrived with (from a ?ref= link).
    ClaimResponse:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        status:
          $ref: '#/components/schemas/ReferralStatus'
        created:
          type: boolean
          description: True when a new referral was created (201); false on idempotent replay (200).
        createdAt:
          type: integer
          format: int64
          description: Unix timestamp.
    Error:
      type: object
      required:
      - status
      - msg
      properties:
        status:
          type: string
          enum:
          - error
          description: Always "error" for error responses
        msg:
          type: string
          description: Human-readable error message
        code:
          type: integer
          description: Application-specific error code
        data:
          type: object
          description: Additional error context
        data2:
          type: object
          description: Additional error details
        requestId:
          type: string
          description: Request ID for debugging
  responses:
    BadRequest:
      description: Bad Request - Invalid input parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidParameter:
              value:
                status: error
                msg: 'Invalid parameter: email format is incorrect'
                code: 400
    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            insufficientPermissions:
              value:
                status: error
                msg: You don't have permission to access this resource
                code: 403
    NotFound:
      description: Not Found - Resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            resourceNotFound:
              value:
                status: error
                msg: Resource not found
                code: 404
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverError:
              value:
                status: error
                msg: An internal error occurred
                code: 500
                requestId: req_abc123
