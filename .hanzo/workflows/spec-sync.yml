# The gate on the artifact, in both directions.
#
# `hanzo.yaml` is OUTPUT — `publish.py` derives it from hanzoai/cloud's own
# emitted `openapi.yaml` at the ref `.spec-lock` pins. Two things can be wrong
# with an output, and they need different questions:
#
#   • publish.py --check   the committed artifact is NOT what its own pinned
#                          input projects to. Somebody hand-edited a generated
#                          file, and an edit to THIS one describes a release
#                          nobody shipped — to seven SDKs, the doc site and the
#                          agent-skills catalog at once. HARD failure on every
#                          push and PR.
#   • publish.py --current the pin is behind cloud's origin/main. Nothing is
#                          wrong with the artifact; it describes an older release
#                          than the one being deployed.
#
# The second is why the trigger is also a clock. The event that makes the pin
# stale happens in hanzoai/cloud, so no push-triggered CI here can catch it —
# measured before this workflow existed: the copy lagged cloud's origin/main
# twice in one afternoon, and each time every SDK, doc page and MCP tool
# generated from it described a router that had already moved. It runs ONLY on
# the clock, because a stale pin is not a broken artifact and must not fail a PR
# that has nothing to do with it.
#
# --check only, and NOTHING is committed. A bot pushing a 3 MB regenerated
# document into main is a second writer on the artifact, and the failure mode —
# an unreviewed API change reaching every client — is worse than the staleness it
# would fix. Red build, one command in the log, a person runs it.
#
# BOTH QUESTIONS NEED A hanzoai/cloud CHECKOUT, AND THAT IS THIS WORKFLOW'S
# WEAKNESS RATHER THAN ITS STRENGTH. hanzoai/cloud is private, the hanzoai org
# is on the FREE plan — where an org secret resolves to the empty string inside
# a private repo — and this repo's only repo-level secret is
# SDK_DISPATCH_TOKEN. So the checkout below is credentialed by whatever of those
# actually reads hanzoai/cloud, and if none does, this workflow is red for a
# reason that has nothing to do with the commit.
#
# THE ENFORCING GATE IS NOT HERE. It is `served` in hanzo.yml, which refutes
# every published operation against api.hanzo.ai/v1/openapi.json — public, no
# credential, no checkout, no ref to trust — and therefore runs on every build
# in the same lane as everything else. This workflow is the deeper question kept
# where it can be asked when a credential exists, not the one holding the line.
name: spec sync

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Hourly. Cloud deploys many times a day and each one can move the document;
    # a daily check would let a stale artifact ship SDKs for most of a working day.
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: spec-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4

      # publish.py reads a hanzoai/cloud CHECKOUT rather than a release artifact,
      # because the document it wants is the one cloud's own drift gate just
      # proved equal to its router. fetch-depth 0: the pin is a TAG, and a
      # shallow clone does not have it.
      - name: Check out hanzoai/cloud
        uses: actions/checkout@v4
        with:
          repository: hanzoai/cloud
          path: .cloud
          fetch-depth: 0
          # The job's automatic token is scoped to THIS repository, so it reads
          # hanzoai/cloud as an anonymous caller and a private repo answers 404
          # — which reads as "repository not found", not "no credential".
          #
          # FORGE_TOKEN first, because this checkout is against the FORGE and
          # GH_PAT is a github.com credential: handing it here spends an hour a
          # run failing with "invalid username, password or token", which reads
          # as an expired secret rather than the wrong one for this host.
          token: ${{ secrets.FORGE_TOKEN || secrets.SDK_DISPATCH_TOKEN || github.token }}

      - name: Is hanzo.yaml what its own input projects to?
        run: |
          # --break-system-packages: the runner image ships a PEP 668
          # "externally managed" interpreter, so a bare pip install exits 1.
          # Under `bash -e` that killed the step BEFORE the gate below ever ran,
          # and the log still showed the gate's error text — so this read as
          # "the spec is stale" when the check had not executed at all. Safe
          # here: the container is discarded after the job.
          python3 -m pip install --quiet --break-system-packages pyyaml
          # Fail loudly and say the ONE command that fixes it. A gate whose
          # message is "differs" sends the reader looking for a diff tool.
          if ! python3 publish.py --check --cloud .cloud; then
            echo "::error::hanzo.yaml is not what its pinned hanzoai/cloud release projects to. It is a GENERATED artifact, so an edit to it describes a release nobody shipped — to every SDK, the doc site and the skills catalog. Fix: change the API in hanzoai/cloud, then run 'python3 publish.py'"
            exit 1
          fi

      - name: Is the pin still cloud's origin/main?
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python3 -m pip install --quiet --break-system-packages pyyaml
          if ! python3 publish.py --current --cloud .cloud; then
            echo "::error::hanzo.yaml describes an older cloud release than origin/main. Every SDK and doc page generated from it describes a router that moved. Fix: python3 publish.py && git commit -am 'publish: <cloud ref>'"
            exit 1
          fi
