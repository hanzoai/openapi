components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Bearer JWT issued by Hanzo IAM (https://hanzo.id) or an hk- API
        key. Discovery: https://hanzo.id/.well-known/openid-configuration.'
  responses:
    Forbidden:
      description: |
        Authenticated, but not permitted — a tenant caller on an admin-only route,
        or an org that does not own the resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Envelope:
      title: Envelope
      description: |
        The response shape of every `/v1/ai/<resource>` route.

        `status` is the outcome, NOT the HTTP code: a handled failure is returned
        as HTTP 200 with `status: error` and a human `msg`. Clients must branch on
        `status`, never on the status line alone. List reads put the total in
        `data2`.
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, error]
        msg:
          type: string
          description: Human-readable failure reason; empty when `status` is `ok`.
        data:
          description: The resource, the list of resources, or null.
        data2:
          description: Secondary payload — the total row count on a paged list.
    Error:
      title: Error
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            type: { type: string }
            code: { type: string }
