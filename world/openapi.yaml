openapi: 3.1.0
info:
  title: Hanzo World API
  description: |
    Hanzo World Model — real-time global-intelligence data on the unified cloud
    /v1 plane. Powers world.hanzo.ai and is consumable by any Hanzo app/agent as
    a data feed. Self-contained Go backend (hanzoai/world, MIT) proxying public
    upstreams (GDELT, CoinGecko, Polymarket, OpenSky, USGS, NASA FIRMS, ACLED,
    FRED, EIA, …) with SSRF-bounded allowlists + short-TTL caching. All routes
    are same-origin `/v1/world/*` (no `/api/` — Hanzo standard).

    AUTH: public data feeds are open (service-level upstream keys where a feed
    requires one; a missing key degrades to a clean empty/`skipped` body, never
    5xx). The AI/inference routes carry NO shared key — they forward the signed-in
    user's IAM token to api.hanzo.ai so inference meters to that user's org +
    project + linked billing account; anonymous callers get a `skipped` body.
  version: 1.0.0
  contact: { name: Hanzo AI, url: https://hanzo.ai, email: support@hanzo.ai }
  license: { name: MIT }
servers:
  - url: https://api.hanzo.ai
    description: Hanzo Gateway
  - url: https://world.hanzo.ai
    description: Hanzo World (same-origin, self-contained fork target *.hanzo.app)
tags:
  - { name: News, description: News, RSS, research feeds }
  - { name: Markets, description: Crypto, equities, macro, econ }
  - { name: Geo, description: Physical/geospatial events }
  - { name: Conflict, description: Conflict + humanitarian data }
  - { name: Intel, description: Computed intelligence signals }
  - { name: AI, description: AI summaries (per-user IAM → org/project/billing) }
  - { name: Video, description: Live news video resolution + player }
  - { name: Meta, description: Health + version }
paths:
  /v1/world/gdelt-doc:
    get:
      tags: [News]
      summary: "GDELT article search"
      operationId: world_gdelt_doc
      parameters:
        - { name: query, in: query, required: true, schema: { type: string } }
        - { name: maxrecords, in: query, required: false, schema: { type: string } }
        - { name: timespan, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
  /v1/world/gdelt-geo:
    get:
      tags: [News]
      summary: "GDELT geo-tagged events"
      operationId: world_gdelt_geo
      parameters:
        - { name: query, in: query, required: true, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string } }
        - { name: maxrecords, in: query, required: false, schema: { type: string } }
        - { name: timespan, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
  /v1/world/rss-proxy:
    get:
      tags: [News]
      summary: "Allowlisted RSS feed proxy (SSRF-bounded)"
      operationId: world_rss_proxy
      parameters:
        - { name: url, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
  /v1/world/hackernews:
    get:
      tags: [News]
      summary: "Hacker News stories"
      operationId: world_hackernews
      parameters:
        - { name: type, in: query, required: false, schema: { type: string } }
