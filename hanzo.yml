# Canonical CI config for hanzoai/openapi — read by the hanzoai/ci reusable
# (.hanzo/workflows/cicd.yml) and platform.hanzo.ai.
#
# Publishes the agent-skills catalog (/.well-known/agent-skills, skills.py
# --no-services) as a versioned immutable image whose rootfs is /catalog.
# hanzoai/cloud consumes it via `FROM ... AS skills` + `COPY --from=skills
# /catalog/`, so it never re-runs skills.py inside a cloud release. hanzoai/ci
# pushes to `repo:` (GHCR) and auto-mirrors to registry.hanzo.ai.
images:
  - name: agent-skills
    context: .
    dockerfile: Dockerfile.skills
    repo: ghcr.io/hanzoai/agent-skills

test:
  - name: spec
    # hanzo.yaml is the single input to SEVEN language SDKs, the doc site and the
    # agent-skills catalog, so a defect merged here is a defect merged into all
    # of them at once, discovered separately in each.
    #
    # test_publish.py is the offline half of the artifact gate: it reads the
    # COMMITTED hanzo.yaml and asserts the properties publish.py promises —
    # every operation generatable, operationIds unique to a GENERATOR and not
    # merely as strings, a security scheme a client can authenticate with, every
    # capability grouped exactly once, and no `<svc>/openapi.yaml` back on disk.
    # It needs no network and no hanzoai/cloud checkout.
    #
    # The ONLINE half is `publish.py --check` in the `spec sync` workflow, which
    # re-derives from the pinned ref and diffs. That is what catches a hand edit
    # that happens to be well-formed — the one this repo exists to make
    # impossible now that hanzo.yaml is output rather than input.
    #
    # test_flows.py asserts every operationId flows.yaml names still exists in
    # hanzo.yaml, so a route that stops being served breaks one gate here instead
    # of six SDKs' examples quietly and separately.
    #
    # uv rather than a bare python3 — the runner image promises no interpreter,
    # let alone one with PyYAML.
    run: |
      set -e
      if command -v uv >/dev/null 2>&1; then UV=uv; else
        curl -fsSL https://astral.sh/uv/install.sh | sh
        UV="$HOME/.local/bin/uv"
      fi
      "$UV" run --no-project --python 3.12 --with pyyaml --with pytest \
        python -m pytest test_publish.py test_flows.py test_skills.py -q
