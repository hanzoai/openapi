    Promo:
      type: object
      description: |
        An admin-set, limited-time discount window applied to plan pricing (e.g. a
        50%-off launch promo), configured at admin.hanzo.ai via /v1/admin/promos.
        The discount is LIVE only when `active` is true AND now is within
        [start, end). `plans` scopes it to specific plan ids (empty = all plans).
      properties:
        id: { type: string, description: Server-assigned id. }
        percentOff: { type: number, format: double, minimum: 0, maximum: 100, description: 'Percent off list price (50 = 50% off).' }
        start: { type: string, format: date-time, description: 'Window start, inclusive (UTC).' }
        end: { type: string, format: date-time, description: 'Window end, exclusive (UTC).' }
        plans: { type: array, items: { type: string }, description: Plan ids the promo applies to; empty = all plans. }
        active: { type: boolean, description: 'Admin on/off toggle; the discount applies only when this is true and now is within [start, end).' }
      required: [id, percentOff, start, end, active]
    PromoCreate:
      type: object
      description: Create a discount promo. `id` is server-assigned and ignored on input.
      properties:
        percentOff: { type: number, format: double, minimum: 0, maximum: 100 }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        plans: { type: array, items: { type: string }, description: Plan ids; empty = all plans. }
        active: { type: boolean, default: true }
      required: [percentOff, start, end]
      additionalProperties: false
    PromoUpdate:
      type: object
      description: Partial update — only the fields present are changed.
      properties:
        percentOff: { type: number, format: double, minimum: 0, maximum: 100 }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        plans: { type: array, items: { type: string } }
        active: { type: boolean }
      additionalProperties: false
