openapi: 3.1.0
info:
  title: Hanzo Datastore API
  summary: Managed analytics datastore (ClickHouse wire) — a dedicated per-org instance.
  description: |
    Provisioning turns "create a datastore" into a real logical resource inside an
    already-live shared backend, or launches the org's OWN isolated instance for
    the dedicated kinds (HIP-0106). Served by the `clients/provisioning`
    subsystem of the unified cloud binary and reached through the gateway at
    `api.hanzo.ai`; the kind string is the Hanzo product name, never the upstream
    OSS backend name.

    Tenancy: every request is scoped to the gateway-minted org (`X-Org-Id` /
    validated principal). A request without a validated principal, or with an
    empty org and no admin claim, is refused 403. The physical backend resource
    is namespaced by a fixed-width org hash so two tenants can never fold onto
    one resource.

    Secrets: generated per-resource passwords are sealed in Hanzo KMS and only a
    `secret_ref` is persisted. When KMS is not configured the service degrades
    safely — it returns the password ONCE in the create response and stores
    nothing in plaintext.

    Authentication: Bearer JWT issued by Hanzo IAM (`https://hanzo.id`). The same
    token authenticates every Hanzo service.
  version: 8.0.0
  contact:
    name: Hanzo AI
    url: https://hanzo.ai
    email: support@hanzo.ai
  license:
    name: BSD 3-Clause License
    identifier: BSD-3-Clause
servers:
  - url: https://api.hanzo.ai
    description: Hanzo Gateway Production
tags:
- name: datastore
security:
  - BearerAuth: []
paths:
  /v1/datastore:
    post:
      tags: [datastore]
      operationId: createDatastore
      summary: Provision a datastore resource (dedicated per-org instance)
      requestBody:
        $ref: '#/components/requestBodies/CreateResource'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      tags: [datastore]
      operationId: listDatastore
      summary: List datastore resources for the caller's org
      responses:
        '200': { $ref: '#/components/responses/ResourceList' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/datastore/{name}:
    parameters:
    - $ref: '#/components/parameters/Name'
    get:
      tags: [datastore]
      operationId: getDatastore
      summary: Get one datastore resource (reconciles live instance status)
      responses:
        '200': { $ref: '#/components/responses/Resource' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [datastore]
      operationId: deleteDatastore
      summary: Deprovision a datastore instance
      responses:
        '204': { $ref: '#/components/responses/Deleted' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
components:
  parameters:
    Name:
      name: name
      in: path
      required: true
      description: |
        The user-supplied resource name (slug). Lowercased and trimmed server-side;
        must match `^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$`.
      schema:
        type: string
        pattern: '^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$'
  requestBodies:
    CreateResource:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateRequest'
  responses:
    BadGateway:
      description: The backend provisioner or dedicated-instance operation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid name or malformed request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: A resource with this name (or physical name) already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Created:
      description: Resource provisioned. Password (if any) is returned ONCE here.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateResponse'
    Deleted:
      description: Resource deprovisioned. No content.
    Forbidden:
      description: No validated principal, or empty org without admin claim.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaymentRequired:
      description: Org balance gate failed (unfunded org).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Resource:
      description: Resource metadata (never a password).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GetResponse'
    ResourceList:
      description: The caller's org resources of this kind (never a password).
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ListItem'
    ServiceUnavailable:
      description: |
        Kind is honestly gated (cannot grant a per-tenant-safe credential), or the
        cluster orchestrator is unavailable for a dedicated kind, or commerce is
        unreachable in the fail-closed posture.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    CreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$'
          description: Resource name (lowercased/trimmed server-side).
          example: analytics
    CreateResponse:
      type: object
      description: |
        Returned on 201. `password` and `username` are present only for secretful
        kinds (sql, kv, and the dedicated datastore/docdb admin credential). The
        password is returned ONCE and is never retrievable again.
      required: [id, kind, name, status, host, port, database, connectionString]
      properties:
        id:
          type: string
          description: Server-generated resource id.
        kind:
          type: string
          enum: [sql, vector, datastore, kv, search, s3, docdb]
        name:
          type: string
        status:
          type: string
          description: Resource status (e.g. "ready", or "provisioning" for a dedicated instance still coming up).
          example: ready
        host:
          type: string
          description: Customer-facing host (public gateway host, or dedicated instance service).
        port:
          type: integer
        username:
          type: string
          description: Present only for secretful kinds.
        database:
          type: string
        connectionString:
          type: string
          description: Public, routable DSN (internal admin host is remapped out).
        password:
          type: string
          description: Present only for secretful kinds; returned ONCE.
    Error:
      type: object
      required: [status, msg]
      properties:
        status:
          type: string
          enum: [error]
        msg:
          type: string
          description: Human-readable error message.
        code:
          type: integer
        requestId:
          type: string
    GetResponse:
      type: object
      required: [id, name, kind, status, host, port, database]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [sql, vector, datastore, kv, search, s3, docdb]
        status:
          type: string
          example: ready
        host:
          type: string
        port:
          type: integer
        username:
          type: string
          description: Present only for secretful kinds.
        database:
          type: string
    ListItem:
      type: object
      required: [id, name, kind, status, host, port, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [sql, vector, datastore, kv, search, s3, docdb]
        status:
          type: string
          example: ready
        host:
          type: string
        port:
          type: integer
        createdAt:
          type: integer
          format: int64
          description: Unix seconds.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JWT issued by Hanzo IAM (https://hanzo.id).
